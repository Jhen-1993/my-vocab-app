<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字卡圖書館 · Word Card Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 英文保留圓潤閱讀感；Noto Sans TC 專責繁體中文，避免不同裝置自動替補的字形不一致。 -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F0F6FE;
    --panel: #FFFFFF;
    --panel-alt: #E7F1FD;
    --ink: #2B3B54;
    --ink-soft: #64758F;
    --ink-faint: #9FAEC4;
    --blue: #3E7BFA;
    --blue-deep: #2A5FD9;
    --mint: #3FAE7C;
    --mint-soft: #E3F6EC;
    --yellow: #FFC93C;
    --yellow-soft: #FFF6DA;
    --amber: #B5650D;
    --goose: #F4E3A1;
    --goose-border: #D9BA5C;
    --goose-soft: #FBF3DC;
    --sun: #FFC93C;
    --coral: #FF6B6B;
    --coral-soft: #FFE8E8;
    --rule: #DCE9FB;
    --rule-strong: #B4D0F6;
    --shadow: 0 10px 24px -12px rgba(46,99,209,0.3);
    --shadow-sm: 0 4px 10px -4px rgba(46,99,209,0.24);
    --font-display: 'Fredoka', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    --font-body: 'Nunito', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    --font-ui: 'Noto Sans TC', 'Microsoft JhengHei', 'Nunito', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Noto Sans TC', 'Microsoft JhengHei', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(700px 380px at 88% -6%, rgba(255,201,74,0.16), transparent 60%),
      radial-gradient(900px 500px at -8% 8%, rgba(62,123,250,0.16), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  /* 讓頁尾在短頁面時自然貼近視窗底部，長頁面時則接在內容下方。 */
  .app{max-width:920px;min-height:100vh;margin:0 auto;padding:26px 18px 36px;display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  header.drawer{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:18px;
  }
  .drawer-label{display:flex; flex-direction:column; gap:2px;}
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--blue-deep); font-weight:600;
  }
  h1{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(24px,4vw,32px); margin:2px 0 0; letter-spacing:.01em; color:var(--ink);
  }
  .subtitle{font-size:13px; color:var(--ink-soft); font-weight:600;}

  /* ---------- mascot banner (the growing baby!) ---------- */
  .mascot-banner{
    display:flex; align-items:center; gap:18px; background:linear-gradient(135deg, var(--yellow-soft), var(--panel-alt) 70%);
    border:2px solid var(--rule-strong); border-radius:26px; padding:14px 20px 14px 14px;
    box-shadow:var(--shadow-sm); margin-bottom:20px; flex-wrap:wrap;
  }
  .mascot-figure{width:68px; height:68px; flex:none; filter:drop-shadow(0 4px 6px rgba(214,120,175,0.25));}
  .mascot-info{flex:1; min-width:180px;}
  .mascot-name{font-family:var(--font-display); font-size:16px; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .mascot-stage-pill{
    font-family:var(--font-ui); font-size:10.5px; background:var(--blue); color:#fff;
    padding:2px 10px; border-radius:999px; letter-spacing:.03em;
  }
  .mascot-progress-track{
    margin-top:8px; height:10px; border-radius:999px; background:#fff; border:1px solid var(--rule-strong); overflow:hidden;
  }
  .mascot-progress-fill{
    height:100%; border-radius:999px; background:linear-gradient(90deg, var(--blue), var(--yellow));
    transition:width .5s ease;
  }
  .mascot-hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-weight:600;}

  /* ---------- tabs ---------- */
  nav.tabs{display:flex; gap:8px; margin:0 0 20px; flex-wrap:wrap;}
  nav.tabs button{
    font-family:var(--font-display); font-size:13px; letter-spacing:.02em;
    background:#fff; color:var(--ink-soft); border:2px solid var(--rule-strong);
    padding:9px 18px; border-radius:999px; cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  nav.tabs button.active{
    background:var(--blue); color:#fff; border-color:var(--blue);
    box-shadow:var(--shadow-sm); transform:translateY(-1px);
  }
  nav.tabs button:hover:not(.active){color:var(--ink); border-color:var(--blue);}

  section.panel{
    background:var(--panel); border:2px solid var(--rule); border-radius:28px;
    box-shadow:var(--shadow); padding:26px 24px; min-height:340px;
  }
  section.panel[hidden]{display:none;}

  /* ---------- loading / empty states ---------- */
  .center-note{
    text-align:center; padding:46px 20px; color:var(--ink-soft);
  }
  .center-note .big{font-family:var(--font-display); font-size:19px; color:var(--ink); margin-bottom:8px;}
  .spinner{
    width:18px; height:18px; border:3px solid var(--rule-strong); border-top-color:var(--blue);
    border-radius:50%; display:inline-block; animation:spin .8s linear infinite; margin-right:8px; vertical-align:-3px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- stat strip ---------- */
  .stat-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:22px;}
  .stat-box{
    background:var(--panel-alt); border:2px solid var(--rule); border-radius:16px; padding:12px 14px;
  }
  .stat-box .num{font-family:var(--font-mono); font-size:21px; font-weight:600; color:var(--blue-deep);}
  .stat-box .lbl{font-size:11px; color:var(--ink-soft); letter-spacing:.02em; font-weight:600;}

  /* ---------- flashcard ---------- */
  .card-wrap{display:flex; justify-content:center;}
  .lib-card{
    width:100%; max-width:520px; background:#fff;
    border:2px solid var(--rule-strong); border-radius:24px;
    box-shadow:var(--shadow); padding:0; position:relative; overflow:hidden;
  }
  .lib-card-head{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-alt); padding:10px 18px;
    font-family:var(--font-ui); font-size:11px; color:var(--blue-deep); letter-spacing:.025em; font-weight:600;
  }
  .lib-card-body{padding:24px 22px 22px;}
  .prompt-kind{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--amber); margin-bottom:10px; font-weight:600;}
  .sentence{font-size:19px; line-height:1.75; font-weight:600;}
  .sentence-zh{font-size:14px; line-height:1.6; color:var(--ink-soft); margin-top:6px; font-weight:600;}
  .sentence-zh-fallback{font-style:italic; color:var(--ink-faint);}
  .blank-slot{
    display:inline-block; min-width:90px; border-bottom:3px dashed var(--blue); text-align:center; font-weight:700;
  }
  .meaning-line{font-size:21px; margin-bottom:6px; font-weight:700; font-family:var(--font-display);}
  .hint-line{font-family:var(--font-ui); font-size:13px; color:var(--ink-faint); letter-spacing:.08em;}

  .help-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .help-row button{font-size:12.5px; padding:7px 14px;}
  .answer-row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .answer-row input{
    flex:1; min-width:160px; font-family:var(--font-body); font-size:16px; font-weight:700; padding:11px 16px;
    border:2px solid var(--rule-strong); border-radius:999px; background:#fff; color:var(--ink);
  }
  .answer-row input:focus{outline:none; border-color:var(--blue);}
  button.primary{
    font-family:var(--font-display); font-size:14px; letter-spacing:.02em;
    background:var(--blue); color:#fff; border:none; padding:11px 20px; border-radius:999px; cursor:pointer;
    box-shadow:var(--shadow-sm);
  }
  button.primary:hover{background:var(--blue-deep);}
  button.ghost{
    font-family:var(--font-display); font-size:13px; background:#fff; color:var(--ink-soft);
    border:2px solid var(--rule-strong); padding:9px 16px; border-radius:999px; cursor:pointer;
  }
  button.ghost:hover{color:var(--blue-deep); border-color:var(--blue);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .feedback{margin-top:16px; font-family:var(--font-body); font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:10px;}
  .feedback.correct{color:var(--mint);}
  .feedback.wrong{color:var(--coral);}
  .stamp{
    font-family:var(--font-display); border:none; border-radius:999px;
    padding:4px 12px; display:inline-block; transform:rotate(-3deg); letter-spacing:.02em; font-size:12.5px; color:#fff;
  }
  .feedback.correct .stamp{background:var(--mint);}
  .feedback.wrong .stamp{background:var(--coral);}
  .queue-note{margin-top:14px; font-size:12px; color:var(--ink-faint); font-family:var(--font-ui);}

  /* ---------- word bank ---------- */
  .add-form{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-bottom:22px;
    border-bottom:2px dashed var(--rule-strong); padding-bottom:20px;
  }
  .add-form .full{grid-column:1/-1;}
  .add-form label{font-family:var(--font-ui); font-size:11px; color:var(--ink-soft); display:block; margin-bottom:4px; letter-spacing:.02em; font-weight:600;}
  .add-form input, .add-form textarea{
    width:100%; font-family:var(--font-body); font-size:14.5px; padding:9px 14px;
    border:2px solid var(--rule-strong); border-radius:14px; background:#fff; color:var(--ink);
  }
  .add-form input:focus, .add-form textarea:focus{outline:none; border-color:var(--blue);}
  .add-form textarea{resize:vertical; min-height:44px;}
  .form-actions{grid-column:1/-1; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .form-hint{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-ui);}

  .word-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px;}
  .flip-card{height:168px; perspective:1200px; cursor:pointer;}
  .flip-card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-card-front, .flip-card-back{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; border:2px solid var(--rule-strong); padding:12px 13px;
    display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow-sm);
  }
  .flip-card-front{background:var(--panel-alt);}
  .flip-card-back{background:var(--panel-alt); transform:rotateY(180deg); overflow:auto;}
  /* 多義字卡在圖書館橫跨兩欄，並按例句文字量自動加高。
     不再把數個不同詞義硬塞進固定高度的小卡。 */
  .flip-card.multi-sense-card{height:var(--sense-card-height,340px); grid-column:span 2;}
  .flip-card.multi-sense-card .flip-card-front{justify-content:center; gap:9px;}
  .flip-card.multi-sense-card .flip-card-back{justify-content:flex-start; padding:15px 18px; overflow:auto;}
  .flip-card.multi-sense-card .fc-top-row{margin-bottom:6px;}
  .flip-card.multi-sense-card .fc-zh{font-size:17px; margin:0 0 7px;}
  .flip-card.multi-sense-card .fc-example{font-size:13px; line-height:1.6;}
  .flip-card.multi-sense-card .fc-example-zh{font-size:11.5px; line-height:1.55; margin-top:4px;}
  .flip-card.multi-sense-card .fc-example-group + .fc-example-group{margin-top:11px; padding-top:11px;}
  .flip-card.status-new .flip-card-front{background:var(--goose-soft); border-color:var(--goose-border);}
  .flip-card.status-known .flip-card-front{background:var(--mint-soft); border-color:var(--mint);}
  .status-row{margin-bottom:6px;}
  .status-filter-btn.active[data-status="new"]{background:var(--goose-border); color:var(--ink); border-color:var(--goose-border);}
  .status-filter-btn.active[data-status="known"]{background:var(--mint); color:#fff; border-color:var(--mint);}
  .fc-top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  /* 左上角把難度與學習狀態視為同一組標籤，避免 NEW 漂在卡片內容區。 */
  .fc-label-group{display:flex; align-items:center; gap:6px; min-width:0;}
  .fc-word{font-family:var(--font-display); font-size:20px; color:var(--ink); font-weight:600; line-height:1.2; word-break:break-word;}
  .fc-bottom-row{display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;}
  .fc-hint{font-size:11px; color:var(--ink-soft); text-align:center; font-family:var(--font-ui); font-weight:600;}
  .fc-help{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);}
  .speak-btn{
    background:#fff; border:2px solid var(--rule-strong); border-radius:999px; width:28px; height:28px;
    font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex:none;
  }
  .speak-btn:hover{border-color:var(--blue); background:var(--blue); }
  .fc-del{
    font-family:var(--font-ui); font-size:10px; color:var(--ink-faint); background:none; border:none;
    cursor:pointer; text-decoration:underline; flex:none;
  }
  .fc-del:hover{color:var(--coral);}
  .fc-zh{font-family:var(--font-ui); font-size:15.5px; color:var(--ink); font-weight:700; margin:2px 0 4px;}
  .fc-example{font-size:11.5px; color:var(--ink-soft); line-height:1.5; font-weight:600;}
  .fc-example-zh{font-size:10.5px; color:var(--ink-faint); line-height:1.4; margin-top:3px;}
  .fc-example-group + .fc-example-group{margin-top:8px; padding-top:8px; border-top:1px solid rgba(68,121,245,.18);}
  .fc-example-sense{display:inline-flex; align-items:center; margin:0 0 3px; padding:2px 7px; border-radius:999px; background:var(--blue-pale); color:var(--blue-deep); font-family:var(--font-ui); font-size:9px; font-weight:800; letter-spacing:.03em;}
  .fc-sense-count{display:inline-flex; align-items:center; align-self:flex-start; gap:4px; padding:4px 8px; border-radius:999px; background:var(--lavender-soft); color:var(--blue-deep); font-family:var(--font-ui); font-size:10px; font-weight:800;}
  .fc-example-empty{color:var(--ink-faint); font-weight:400;}
  .hl-word{color:var(--blue-deep);}
  .box-badge{
    font-family:var(--font-display); font-size:11px; padding:3px 11px; border-radius:999px;
    border:none; color:#fff; white-space:nowrap;
  }
  /* 放在程度標籤旁時維持相近的視覺高度，並保留 NEW 的醒目黃色。 */
  .fc-label-group .box-badge{font-size:10px; line-height:1.2; padding:3px 9px;}
  .box-badge.new{background:var(--yellow); color:var(--ink);}
  .box-badge.cycle{background:var(--mint);}
  .due-date{font-family:var(--font-ui); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; font-variant-numeric:tabular-nums;}

  .deck-grid-wrap{margin-bottom:24px;}
  .sync-row{margin-top:12px;}
  .sync-row button{font-size:12px;}
  .bulk-wrap{margin-bottom:24px; border:2px dashed var(--rule-strong); border-radius:20px; padding:16px 18px;}
  .bulk-format-hint{margin:0 0 10px; line-height:1.6;}
  .bulk-format-hint code{
    background:var(--yellow-soft); border-radius:6px; padding:1px 6px; font-family:var(--font-mono); font-size:11px;
  }
  .bulk-textarea{
    width:100%; min-height:110px; font-family:var(--font-mono); font-size:12.5px; padding:10px 12px;
    border:2px solid var(--rule-strong); border-radius:14px; background:#fff; color:var(--ink); resize:vertical;
  }
  .bulk-textarea:focus{outline:none; border-color:var(--blue);}
  .bulk-actions{margin-top:10px;}
  .bulk-upload-label{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px;
  }
  .deck-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:10px;}
  .deck-card{
    border:2px solid var(--rule-strong); border-radius:20px; padding:14px 16px 16px; background:var(--panel-alt);
    display:flex; flex-direction:column; gap:8px;
  }
  .deck-card.imported{background:var(--mint-soft); border-color:var(--mint);}
  .deck-card-top{display:flex; justify-content:space-between; align-items:baseline;}
  .deck-name{font-family:var(--font-display); font-size:15px; color:var(--ink);}
  .deck-count{font-family:var(--font-ui); font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .deck-desc{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5; flex:1; font-weight:600;}
  .deck-done{font-family:var(--font-ui); font-size:12px; color:var(--mint);}

  .bank-list-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .bank-controls{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .filter-row{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-btn{
    font-family:var(--font-ui); font-size:11.5px; background:#fff; color:var(--ink-soft);
    border:2px solid var(--rule-strong); padding:5px 12px; border-radius:999px; cursor:pointer;
  }
  .filter-btn.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  /* 最常用的三種學習狀態改成單一分段控制，減少按鈕堆疊的感覺。 */
  .bank-controls .status-row{gap:0; margin:0; overflow:hidden; border:2px solid var(--rule-strong); border-radius:999px; background:#fff;}
  .bank-controls .status-row .filter-btn{border:0; border-radius:0; padding:6px 10px;}
  .bank-controls .status-row .filter-btn + .filter-btn{border-left:1px solid var(--rule-strong);}
  .bank-controls .status-row .filter-btn.active{background:var(--blue); color:#fff;}
  .bank-controls .status-row .status-filter-btn.active[data-status="new"]{background:var(--goose-border); color:var(--ink);}
  .bank-controls .status-row .status-filter-btn.active[data-status="known"]{background:var(--mint); color:#fff;}
  /* 進階條件收進面板，保留所有篩選能力而不讓單字庫一開始就塞滿按鈕。 */
  .filter-toggle{display:inline-flex; align-items:center; gap:6px;}
  .filter-toggle.active{background:var(--blue-soft); color:var(--blue-deep); border-color:var(--blue);}
  .filter-count{display:inline-grid; place-items:center; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--blue); color:#fff; font-size:9px;}
  .filter-summary{font-family:var(--font-ui); font-size:10.5px; color:var(--ink-faint); width:100%;}
  .filter-panel{margin:0 0 16px; padding:13px 14px; border:1.5px solid var(--rule-strong); border-radius:17px; background:var(--panel-alt);}
  .filter-panel[hidden]{display:none;}
  .filter-section + .filter-section{margin-top:10px; padding-top:10px; border-top:1px solid var(--rule);}
  .filter-section-label{display:block; margin-bottom:6px; font-family:var(--font-ui); font-size:10px; color:var(--ink-faint); font-weight:700; letter-spacing:.03em;}
  .filter-panel .filter-btn{font-size:10.5px; padding:4px 9px;}
  .filter-reset{margin-top:12px; color:var(--ink-faint); border-color:transparent; background:transparent; text-decoration:underline;}
  .filter-reset:hover{color:var(--coral); border-color:transparent;}
  /* 難度標籤採中性石灰色；醒目的黃色只保留給 NEW 的學習狀態。 */
  .cat-tag{
    font-family:var(--font-ui); font-size:10px; color:#667085; border:1.5px solid #cbd3df; background:#f7f8fa;
    border-radius:999px; padding:2px 9px; white-space:nowrap; font-weight:700;
  }
  /* 詞性獨立於程度標籤：以小貼紙呈現多詞性（例如 n.／v.），也可作為字庫篩選條件。 */
  .pos-tag{
    display:inline-flex; align-items:center; gap:4px; width:fit-content;
    font-family:var(--font-mono); font-size:10px; color:var(--blue-deep);
    border:1.5px solid #a9c4f1; background:#eaf2ff; border-radius:8px 11px 11px 8px;
    box-shadow:1px 1.5px 0 #a9c4f1; padding:3px 8px; white-space:nowrap;
    font-weight:700; letter-spacing:.01em; margin-top:6px;
  }
  /* 小星點讓詞性標籤更容易辨識，但不會搶走英文單字的視覺焦點。 */
  .pos-tag::before{content:"✦"; color:var(--amber); font-size:8px; line-height:1;}
  .pos-tag.pending{color:var(--ink-faint); border-color:var(--rule-strong); background:var(--panel-alt); box-shadow:1px 1.5px 0 var(--rule-strong);}
  .pos-tag.pending::before{content:"?"; color:var(--ink-faint);}

  /* ---------- stats ---------- */
  .chart-block{margin-bottom:26px;}
  .chart-title{font-family:var(--font-ui); font-size:12px; letter-spacing:.025em; color:var(--ink-soft); margin-bottom:10px; font-weight:600;}
  .bar-row{display:flex; align-items:flex-end; gap:5px; height:120px; border-bottom:2px solid var(--rule-strong); padding-bottom:2px;}
  .bar{
    flex:1; background:var(--yellow); border-radius:6px 6px 2px 2px; min-height:2px; position:relative;
  }
  .bar.acc-good{background:var(--mint);}
  .bar.acc-bad{background:var(--coral);}
  .bar-labels{display:flex; gap:5px; margin-top:5px;}
  .bar-labels span{flex:1; text-align:center; font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint);}

  .stats-mascot-block{
    display:flex; align-items:center; gap:20px; background:linear-gradient(135deg, var(--yellow-soft), var(--panel-alt) 70%);
    border:2px solid var(--rule-strong); border-radius:22px; padding:18px 20px; margin-bottom:24px; flex-wrap:wrap;
  }
  .stats-mascot-figure{width:96px; height:96px; flex:none; filter:drop-shadow(0 6px 8px rgba(214,120,175,0.28));}
  .stats-mascot-copy{flex:1; min-width:200px;}
  .stats-mascot-title{font-family:var(--font-display); font-size:18px; color:var(--ink);}
  .stats-mascot-desc{font-size:12.5px; color:var(--ink-soft); margin-top:4px; font-weight:600; line-height:1.5;}

  .danger-zone{border-top:2px dashed var(--rule-strong); margin-top:26px; padding-top:16px;}
  .danger-zone button{color:var(--coral); border-color:var(--coral);}
  /* ---------- speaking practice ---------- */
  .speak-intro{margin-bottom:18px;}
  .speak-api-notice{
    background:var(--goose-soft); border:2px solid var(--goose-border); border-radius:12px;
    padding:8px 12px; margin-top:8px; color:var(--ink);
  }
  .speak-connection{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--mint-soft); border:2px solid var(--mint); border-radius:16px;
    padding:12px 14px; margin:0 0 18px;
  }
  .speak-connection.is-unconfigured{background:var(--yellow-soft); border-color:var(--goose-border);}
  .speak-connection-copy{font-size:12.5px; line-height:1.5; color:var(--ink-soft); font-weight:600;}
  .speak-connection-title{font-family:var(--font-display); color:var(--ink); font-size:15px; margin-bottom:2px;}
  .speak-setup{max-width:580px; margin:0 auto;}
  .speak-setup h2{font-family:var(--font-display); margin:0 0 6px; font-size:23px; color:var(--ink);}
  .speak-setup-lead{margin:0 0 18px; color:var(--ink-soft); font-size:13px; line-height:1.6; font-weight:600;}
  .speak-setup-card{border:2px solid var(--rule-strong); border-radius:20px; background:var(--panel-alt); padding:16px; margin:12px 0;}
  .speak-provider-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .speak-provider-btn{background:#fff; border:2px solid var(--rule-strong); border-radius:14px; padding:11px; color:var(--ink-soft); cursor:pointer; font-family:var(--font-display); font-size:14px;}
  .speak-provider-btn.active{background:var(--blue); border-color:var(--blue); color:#fff;}
  .speak-setup label{display:block; font-family:var(--font-ui); font-size:11px; color:var(--ink-soft); margin:12px 0 5px; font-weight:600;}
  .speak-setup input{width:100%; border:2px solid var(--rule-strong); border-radius:12px; padding:10px 12px; color:var(--ink); font:600 13px var(--font-body); background:#fff;}
  .speak-setup input:focus{outline:none; border-color:var(--blue);}
  .speak-setup-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  .speak-setup-result{font-size:12px; font-weight:700; color:var(--ink-soft);}
  .speak-setup-guide{font-size:12px; line-height:1.6; color:var(--ink-soft); margin:10px 0 0;}
  .speak-setup-guide code{font-family:var(--font-mono); font-size:11px; background:#fff; padding:1px 4px; border-radius:4px;}
  .speak-setup-steps{display:grid; gap:8px; margin:14px 0 4px;}
  .speak-setup-step{display:flex; gap:10px; align-items:flex-start; background:#fff; border:1.5px solid var(--rule-strong); border-radius:12px; padding:9px 10px; font-size:12px; color:var(--ink-soft); line-height:1.5; font-weight:600;}
  .speak-setup-step-num{background:var(--blue); color:#fff; width:22px; height:22px; border-radius:999px; display:inline-flex; justify-content:center; align-items:center; flex:none; font-family:var(--font-mono); font-size:11px;}
  .speak-setup-step strong{color:var(--ink);}
  .speak-deploy-link{display:inline-flex; align-items:center; justify-content:center; text-decoration:none;}
  .speak-topic-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px;}
  .speak-topic-card{
    border:2px solid var(--rule-strong); border-radius:20px; padding:18px 16px; background:var(--panel-alt);
    display:flex; flex-direction:column; gap:8px; text-align:center;
  }
  .speak-topic-icon{font-size:30px;}
  .speak-topic-title{font-family:var(--font-display); font-size:16px; color:var(--ink);}
  .speak-topic-desc{font-size:12px; color:var(--ink-soft); flex:1; line-height:1.5; margin:0;}
  .speak-start-btn{font-size:13px;}

  .speak-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .speak-header-title{font-family:var(--font-display); font-size:16px; color:var(--ink);}
  .speak-messages{
    display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto;
    padding:6px 2px 10px; margin-bottom:10px;
  }
  .speak-bubble{max-width:80%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.6;}
  .speak-bubble-ai{
    align-self:flex-start; background:var(--panel-alt); border:2px solid var(--rule-strong);
    border-bottom-left-radius:4px;
  }
  .speak-bubble-role{font-family:var(--font-ui); font-size:10.5px; color:var(--blue-deep); font-weight:600; margin-bottom:4px;}
  .speak-bubble-zh{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .speak-bubble-user{
    align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px;
  }
  .speak-bubble-loading{display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:13px;}
  .speak-correction{
    align-self:flex-end; max-width:80%; background:var(--goose-soft); border:2px solid var(--goose-border);
    border-radius:14px; padding:9px 13px; font-size:12.5px; line-height:1.5;
  }
  .speak-correction-label{font-family:var(--font-ui); font-size:10.5px; color:var(--amber); font-weight:600; margin-bottom:3px;}
  .speak-correction-better{font-weight:700; color:var(--ink);}
  .speak-correction-note{color:var(--ink-soft); margin-top:3px;}

  .speak-input-row{display:flex; gap:8px; align-items:center;}
  .speak-mic-btn{
    flex:none; width:44px; height:44px; border-radius:999px; border:2px solid var(--rule-strong);
    background:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .speak-mic-btn.speak-mic-active{background:var(--coral); border-color:var(--coral); animation:pulse 1s infinite;}
  .speak-mic-btn.speak-mic-unavailable{opacity:.4; cursor:not-allowed;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .speak-input-row input{
    flex:1; font-family:var(--font-body); font-size:15px; padding:10px 14px;
    border:2px solid var(--rule-strong); border-radius:999px; background:#fff; color:var(--ink);
  }
  .speak-input-row input:focus{outline:none; border-color:var(--blue);}
  .speak-mic-hint{margin-top:8px; text-align:center; min-height:14px;}

  .backup-zone{border-top:2px dashed var(--rule-strong); margin-top:26px; padding-top:16px;}
  .backup-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .backup-import-label{display:inline-flex; align-items:center; cursor:pointer;}

  /* 頁尾使用低彩度圓角資訊卡，讓儲存提示自然融入整體視覺。 */
  footer.note{
    display:grid; grid-template-columns:minmax(180px, .8fr) minmax(260px, 1.4fr); align-items:center; gap:18px;
    margin:auto 4px 0; padding:15px 16px; border:1.5px solid rgba(156,180,222,.42); border-radius:18px;
    background:linear-gradient(105deg, rgba(232,240,255,.8), rgba(255,248,223,.72));
    box-shadow:0 8px 22px rgba(39,71,122,.055);
    font-size:11px; line-height:1.65; color:var(--ink-faint); font-family:var(--font-ui);
  }
  .footer-brand{display:flex; align-items:center; gap:8px; min-width:0;}
  .footer-seal{display:grid; place-items:center; width:24px; height:24px; border-radius:9px; background:var(--yellow-soft); color:var(--amber); font-size:12px; flex:none;}
  .footer-title{display:block; color:var(--ink); font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:.02em;}
  .footer-tagline{display:block; margin-top:1px; font-size:9.5px; color:var(--ink-faint); letter-spacing:.025em;}
  .footer-meta{text-align:right; min-width:0;}
  /* 其他工具採用小型外連入口，不佔用主導覽列，也能維持學習工具群的一致感。 */
  .footer-tool{
    display:inline-flex; align-items:center; gap:5px; margin:0 0 7px auto; padding:3px 8px;
    border:1.5px solid var(--rule-strong); border-radius:999px; background:#fff; color:var(--blue-deep);
    text-decoration:none; font-size:10px; font-weight:700; transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .footer-tool:hover{transform:translateY(-1px); border-color:var(--blue); background:var(--blue-soft);}
  .footer-copy{display:block; max-width:600px; margin-left:auto;}
  .footer-copyright{display:block; margin-top:4px; color:var(--ink-faint); font-size:9.5px;}

  .save-error-banner{
    position:fixed; left:12px; right:12px; bottom:12px; z-index:200;
    background:var(--coral-soft); border:2px solid var(--coral); color:var(--ink);
    border-radius:16px; padding:12px 14px; font-size:12.5px; line-height:1.6;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .save-error-banner button{
    font-family:var(--font-display); font-size:12px; background:var(--coral); color:#fff;
    border:none; padding:6px 14px; border-radius:999px; cursor:pointer; flex:none;
  }

  @media (max-width:640px){
    /* 手機優先：把桌面雙欄與長控制列轉為單欄或可換行，避免按鈕與輸入框被壓縮。 */
    .app{padding:20px 14px 32px;}
    header.drawer{align-items:flex-start; gap:10px; margin-bottom:14px;}
    h1{font-size:clamp(23px,7vw,28px);}
    nav.tabs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-bottom:16px;}
    nav.tabs button{width:100%; min-height:42px; padding:7px 8px; font-size:12px; line-height:1.2;}
    section.panel{padding:18px 14px; border-radius:22px; min-height:0;}
    .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:16px;}
    .stat-box{padding:10px 11px;}
    .lib-card-body{padding:20px 16px;}
    .lib-card-head{padding:9px 13px; font-size:10px;}
    .sentence{font-size:17px; line-height:1.65;}
    .answer-row{display:grid; grid-template-columns:1fr; gap:8px;}
    .answer-row input{min-width:0; width:100%; min-height:44px; font-size:16px;}
    button.primary,button.ghost{min-height:42px; padding:9px 14px; line-height:1.25; white-space:normal;}
    .add-form{grid-template-columns:1fr; gap:10px;}
    .add-form input,.add-form textarea{font-size:16px; min-height:42px;}
    .form-actions{align-items:stretch;}
    .form-actions button,.bulk-upload-label{min-height:40px; justify-content:center;}
    .deck-grid{grid-template-columns:1fr;}
    .bank-list-head{align-items:stretch; gap:8px;}
    .bank-controls{width:100%; justify-content:space-between;}
    .bank-controls .status-row{flex:1; min-width:0;}
    .bank-controls .status-row .filter-btn{flex:1; padding:7px 5px; font-size:10.5px;}
    .filter-toggle{min-height:38px;}
    .filter-panel{padding:12px;}
    .filter-panel .filter-btn{min-height:34px; padding:5px 8px;}
    .word-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
    .flip-card{height:174px;}
    .flip-card-front,.flip-card-back{padding:10px;}
    .flip-card.multi-sense-card{grid-column:1/-1; min-height:320px;}
    .flip-card.multi-sense-card .flip-card-back{padding:14px 16px;}
    .flip-card.multi-sense-card .fc-example{font-size:12.5px;}
    .flip-card.multi-sense-card .fc-example-zh{font-size:11.5px;}
    .fc-word{font-size:18px;}
    .fc-zh{font-size:14px;}
    .fc-example{font-size:10.5px;}
    .speak-provider-row{grid-template-columns:1fr;}
    .speak-provider-btn{min-height:43px;}
    .speak-setup-card{padding:14px;}
    .speak-setup input{font-size:16px; min-height:42px;}
    .speak-topic-grid{grid-template-columns:1fr;}
    .speak-bubble,.speak-correction{max-width:94%;}
    .speak-input-row{align-items:stretch; flex-wrap:wrap;}
    .speak-input-row input{min-width:0; min-height:44px; font-size:16px;}
    .speak-input-row .primary{flex:1;}
    .mascot-banner{padding:12px; gap:12px;}
    footer.note{grid-template-columns:1fr; gap:10px;}
    .footer-meta,.footer-copy{text-align:left; margin-left:0;}
    .footer-tool{margin-left:0;}
  }

  /* ---------- daily flashcard study screen ---------- */
  .study-screen{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:24px 18px;
    background:
      radial-gradient(700px 380px at 88% -6%, rgba(255,201,74,0.18), transparent 60%),
      radial-gradient(900px 500px at -8% 8%, rgba(62,123,250,0.2), transparent 55%),
      var(--bg);
  }
  .study-screen[hidden]{display:none;}
  .study-wrap{width:100%; max-width:480px;}
  .study-progress-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .study-progress-label{font-family:var(--font-ui); font-size:12px; color:var(--ink-soft); font-weight:600; font-variant-numeric:tabular-nums;}
  .study-skip{font-size:11.5px; padding:6px 12px;}

  .study-card{height:280px; perspective:1400px; cursor:pointer; margin:14px 0 20px;}
  .study-card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .study-card.flipped .study-card-inner{transform:rotateY(180deg);}
  .study-card-front, .study-card-back{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:26px; border:2px solid var(--rule-strong); background:#fff;
    box-shadow:var(--shadow); padding:26px 24px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:12px;
  }
  /* 多義字在預習卡完整並列；卡片會依內容加高，捲動只作極長內容的保險。 */
  .study-card-back{background:var(--yellow-soft); transform:rotateY(180deg); overflow:hidden;}
  .study-card.multi-sense-study-card{height:var(--study-sense-card-height,360px);}
  .study-card.multi-sense-study-card .study-card-back{justify-content:flex-start; overflow:auto; padding:20px 22px;}
  .study-word{font-family:var(--font-display); font-size:30px; color:var(--ink); font-weight:600;}
  .study-flip-hint{font-family:var(--font-ui); font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .study-zh{font-family:var(--font-display); font-size:22px; color:var(--ink); font-weight:600;}
  .study-example{font-size:14px; color:var(--ink-soft); line-height:1.6; font-weight:600;}
  .study-example-pos{font-size:11.5px; color:var(--blue-deep); font-family:var(--font-mono); font-weight:700; margin-top:5px;}
  .study-example-zh{font-size:12.5px; color:var(--ink-faint); line-height:1.5;}
  .study-example-group + .study-example-group{margin-top:12px; padding-top:12px; border-top:1px solid rgba(68,121,245,.2);}
  .study-example-sense{display:inline-flex; align-items:center; margin:0 0 4px; padding:3px 9px; border-radius:999px; background:var(--blue-pale); color:var(--blue-deep); font-family:var(--font-ui); font-size:10px; font-weight:800; letter-spacing:.03em;}
  .study-example-empty{color:var(--ink-faint); font-weight:400;}

  .study-nav{display:flex; justify-content:space-between; gap:10px;}
  .study-nav button{flex:1;}
  .study-nav button:disabled{opacity:.4; cursor:default;}

  .study-complete{
    background:#fff; border:2px solid var(--rule-strong); border-radius:26px; box-shadow:var(--shadow);
    padding:36px 26px; text-align:center;
  }
  .study-complete-big{font-family:var(--font-display); font-size:20px; color:var(--ink); margin-bottom:8px;}
  .study-complete-sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px; font-weight:600; line-height:1.6;}

  /* 預習覆蓋層另設手機規則，確保第一個接觸到的字卡畫面也容易單手操作。 */
  @media (max-width:640px){
    .study-screen{padding:16px 14px; align-items:flex-start; overflow-y:auto;}
    .study-wrap{padding:6px 0 18px;}
    .study-progress-row{align-items:flex-start;}
    .study-progress-label{padding-top:5px;}
    .study-skip{font-size:11px; padding:6px 9px;}
    .study-card{height:262px; margin:12px 0 16px;}
    .study-card.multi-sense-study-card{height:var(--study-sense-card-height,340px);}
    .study-card.multi-sense-study-card .study-card-back{padding:18px 15px; gap:9px;}
    .study-card-front,.study-card-back{padding:20px 16px; gap:10px;}
    .study-word{font-size:28px;}
    .study-zh{font-size:20px;}
    .study-example{font-size:13px;}
    .study-example-zh{font-size:12px;}
    .study-nav{gap:8px;}
    .study-nav button{min-height:44px; padding:8px 10px; font-size:12px;}
    .study-complete{padding:28px 18px;}
  }
</style>
</head>

<!-- 先載入所有字庫與集中例句，再由 decks.js 合併、去重並套用例句；主程式最後才讀取 DECKS。 -->

<!-- 版本參數可避免 GitHub Pages 或瀏覽器繼續使用舊的例句資料快取。 -->
<script src="data/advanced.js?v=20260814-quality-gate-v48"></script>
<script>
(function(){
  "use strict";

  // 詞性資料已隨三個字庫檔載入；下列函式供畫面顯示與詞性篩選共用。
  function normalizePartOfSpeech(posText){
    var aliases = {
      "n":"n.", "noun":"n.", "v":"v.", "verb":"v.", "adj":"adj.", "adjective":"adj.",
      "adv":"adv.", "adverb":"adv.", "prep":"prep.", "preposition":"prep.", "conj":"conj.",
      "conjunction":"conj.", "pron":"pron.", "pronoun":"pron.", "quant":"quant.",
      "quantifier":"quant.", "phrasal verb":"phr.v.", "phrasal-verb":"phr.v.", "phr.v":"phr.v."
    };
    return String(posText || "").split(/[／/]/).map(function(part){
      var key = part.trim().toLowerCase();
      return aliases[key] || part.trim();
    }).filter(Boolean).join("／");
  }

  function getPartOfSpeech(en, explicitPos){
    var normalized = normalizePartOfSpeech(explicitPos);
    var key = String(en || "").trim().toLowerCase().replace(/／/g, "/");
    return POS_LABEL_OVERRIDES[key] || normalized || PARTS_OF_SPEECH[key] || "未標註";
  }

  function hasPartOfSpeech(posText, requestedPos){
    if(requestedPos === "all") return true;
    return String(posText || "").split(/[／/]/).indexOf(requestedPos) !== -1;
  }

  // ---------------- 全域常數：所有模組共用的固定設定 ----------------
  var STORAGE_KEY = "vocab-notebook-data";
  // 詞性稽核表：保留字典的全部詞性，並另外標記例句中的實際詞性。
  // 先收錄已由上下文人工判定的跨詞性卡片；其餘會在後續批次加入。
  // The audited metadata is defined in data/advanced.js, after all three decks load.
  // The fallbacks keep custom cards usable even if that data file is unavailable.
  // Use window.* here because this main script is wrapped in a function scope,
  // while the three deck files intentionally publish their audited data globally.
  var EXAMPLE_POS_AUDIT = (typeof window !== "undefined" && window.EXAMPLE_POS_AUDIT && typeof window.EXAMPLE_POS_AUDIT === "object")
    ? window.EXAMPLE_POS_AUDIT : Object.create(null);
  var POS_LABEL_OVERRIDES = (typeof window !== "undefined" && window.POS_LABEL_OVERRIDES && typeof window.POS_LABEL_OVERRIDES === "object")
    ? window.POS_LABEL_OVERRIDES : Object.create(null);
  function getExamplePartOfSpeech(word){
    return EXAMPLE_POS_AUDIT[String(word || "").trim().toLowerCase()] || "";
  }
  // Some English words have separate everyday meanings.  Keep the primary
  // example on the card itself and list any additional, meaning-specific
  // examples here so learners never have to infer which sense is being used.
  var EXAMPLE_VARIANTS = (typeof window !== "undefined" && window.EXAMPLE_VARIANTS && typeof window.EXAMPLE_VARIANTS === "object")
    ? window.EXAMPLE_VARIANTS : Object.create(null);
  // Extra sentences with the same meaning are for later review only.  They
  // are deliberately separate from EXAMPLE_VARIANTS, which controls what is
  // visibly shown on a card.
  var REVIEW_EXAMPLE_VARIANTS = (typeof window !== "undefined" && window.REVIEW_EXAMPLE_VARIANTS && typeof window.REVIEW_EXAMPLE_VARIANTS === "object")
    ? window.REVIEW_EXAMPLE_VARIANTS : Object.create(null);
  var CURATED_EXAMPLE_UPDATES = (typeof window !== "undefined" && window.CURATED_EXAMPLE_UPDATES && typeof window.CURATED_EXAMPLE_UPDATES === "object")
    ? window.CURATED_EXAMPLE_UPDATES : Object.create(null);
  var BUILTIN_WORD_RENAMES = (typeof window !== "undefined" && window.BUILTIN_WORD_RENAMES && typeof window.BUILTIN_WORD_RENAMES === "object")
    ? window.BUILTIN_WORD_RENAMES : Object.create(null);
  function getCardExamples(word){
    var key = String(word.en || "").trim().toLowerCase();
    var settings = EXAMPLE_VARIANTS[key] || {};
    var variants = [];
    var primarySense = typeof settings.primarySense === "string" ? settings.primarySense : "";
    if(word.example){
      variants.push({
        sense: primarySense,
        example: String(word.example),
        exampleZh: String(word.exampleZh || ""),
        pos: getExamplePartOfSpeech(word.en)
      });
    }
    var alternatives = Array.isArray(settings.alternatives) ? settings.alternatives : [];
    alternatives.forEach(function(item){
      if(!item || !item.example) return;
      var duplicate = variants.some(function(current){
        return current.example === String(item.example);
      });
      if(!duplicate){
        variants.push({
          sense: String(item.sense || ""),
          example: String(item.example),
          exampleZh: String(item.exampleZh || ""),
          pos: String(item.pos || getExamplePartOfSpeech(word.en) || "")
        });
      }
    });
    return variants;
  }
  // Estimate a readable height for the expanded multi-sense card.  The back
  // remains scrollable only as a safe fallback for unusually long custom text.
  function getMultiSenseCardHeight(examples){
    if(!examples || examples.length < 2) return 0;
    var estimatedLines = 0;
    examples.forEach(function(item){
      estimatedLines += item.sense ? 1 : 0;
      estimatedLines += Math.max(1, Math.ceil(String(item.example || "").length / 32));
      estimatedLines += item.pos ? 1 : 0;
      estimatedLines += item.exampleZh ? Math.max(1, Math.ceil(String(item.exampleZh).length / 20)) : 0;
    });
    return Math.max(320, 82 + estimatedLines * 19 + (examples.length - 1) * 16);
  }
  // Start with the one visible card example, then add same-sense alternatives
  // only when a later review question is generated.  This keeps cards clean
  // while still preventing practice from becoming repetitive.
  function getReviewExamples(word){
    var key = String(word.en || "").trim().toLowerCase();
    var variants = getCardExamples(word).slice();
    var settings = REVIEW_EXAMPLE_VARIANTS[key] || {};
    var alternatives = Array.isArray(settings.alternatives) ? settings.alternatives : [];
    alternatives.forEach(function(item){
      if(!item || !item.example) return;
      var example = String(item.example);
      var duplicate = variants.some(function(current){ return current.example === example; });
      if(!duplicate){
        variants.push({
          sense: "",
          example: example,
          exampleZh: String(item.exampleZh || ""),
          pos: String(item.pos || getExamplePartOfSpeech(word.en) || word.pos || "")
        });
      }
    });
    return variants;
  }
  function renderCardExamples(word, display){
    var examples = getCardExamples(word);
    if(!examples.length){
      return '<div class="' + (display === "study" ? "study-example" : "fc-example") + ' ' +
        (display === "study" ? "study-example-empty" : "fc-example-empty") + '還沒有例句</div>';
    }
    var isStudy = display === "study";
    var groupClass = isStudy ? "study-example-group" : "fc-example-group";
    var senseClass = isStudy ? "study-example-sense" : "fc-example-sense";
    var exampleClass = isStudy ? "study-example" : "fc-example";
    var posClass = isStudy ? "study-example-pos" : "fc-example-zh";
    var zhClass = isStudy ? "study-example-zh" : "fc-example-zh";
    // 不同義項必須在卡片上並列；同義的備用句只由 getReviewExamples
    // 加入後續循環複習，不會使預習卡重複堆疊相同意思。
    var visibleExamples = examples;
    return visibleExamples.map(function(item){
      return '<div class="' + groupClass + '">' +
        (item.sense ? '<div class="' + senseClass + '">' + escapeHtml(item.sense) + '</div>' : "") +
        '<div class="' + exampleClass + '">' + highlightWord(item.example, word.en) + '</div>' +
        (item.pos ? '<div class="' + posClass + '">本句詞性：' + escapeHtml(item.pos) + '</div>' : "") +
        (item.exampleZh ? '<div class="' + zhClass + '">' + escapeHtml(item.exampleZh) + '</div>' : "") +
      '</div>';
    }).join("");
  }
  // Vocabulary is maintained in data/beginner.js, data/intermediate.js,
  // data/real-word-extension.js, and data/advanced.js.
  // The displayed count is calculated from the active decks below.  Some
  // imported expansion cards are intentionally held back by the quality gate
  // until they have a natural example sentence, so never hard-code this total.
  // A correctly recalled word is maintained every two weeks.  An incorrect
  // answer starts the recovery sequence: day 1 -> 2 -> 4 -> 7 -> 15 -> 30.
  // Values are gaps between reviews after the initial incorrect answer.
  var CORRECT_REVIEW_INTERVAL = 14;
  var RECOVERY_INTERVALS = [1, 2, 3, 8, 15];
  var MAX_REDRILL = 2; // how many extra times a missed word re-appears in the same session
  var DAILY_TARGET = 30; // number of practice sentences to serve each day

  var DECK_META = {
    beginner: { label: "初階", desc: "生活基礎字彙（CEFR A2 程度），適合打底" },
    intermediate: { label: "中階", desc: "職場、日常應用字彙（CEFR B1–B2／TOEIC 約 550–700 分）" },
    advanced: { label: "高階", desc: "學術與抽象論述字彙（TOEFL／IELTS／進階字彙）" },
    bulk: { label: "批次匯入", desc: "" },
    custom: { label: "自訂", desc: "" }
  };

  // ---------------- 畫面與學習狀態：只存在目前分頁記憶體 ----------------
  var data = null;      // { words: [...], reviewLog: [...] }
  var loaded = false;
  var currentTab = "review";
  var bankFilter = "all";
  var bankStatusFilter = "all"; // all | new | known
  var bankPosFilter = "all"; // all | n. | v. | adj. | adv. | prep. | conj. | pron. | quant. | phr.v. | idiom
  var bankFiltersOpen = false; // 控制詞性與難度的進階篩選面板，避免首頁過多按鈕。
  var bankOrderIds = null; // custom shuffle order for the word-bank flip cards
  var session = null;   // { queue: [...ids], pos, correctCount, wrongCount, currentWord }
  var studyWords = [];  // today's flashcard preview queue, shown before the main app
  var studyIndex = 0;
  var studyFlipped = false;

  var reviewEl = document.getElementById("panel-review");
  var bankEl = document.getElementById("panel-bank");
  var speakEl = document.getElementById("panel-speak");
  var statsEl = document.getElementById("panel-stats");

  // ---------------- 日期工具：所有複習日期統一使用本地 YYYY-MM-DD ----------------
  // 產生本地日期字串，作為排程、學習紀錄與儲存資料的共同鍵值。
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  // 將月份與日期補成兩位數，避免字串日期無法正確排序。
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  // 以本地日期加減天數；不用毫秒直接相加，以避開日光節約時間的問題。
  function addDays(dateStr, n){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  // 回傳兩個 YYYY-MM-DD 日期相差的整數天數。
  function daysBetween(a, b){
    var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    var da = new Date(pa[0], pa[1]-1, pa[2]);
    var db = new Date(pb[0], pb[1]-1, pb[2]);
    return Math.round((db - da) / 86400000);
  }
  // 答錯（或使用提示／答案）時重設鞏固循環：下一次固定排在隔天。
  function startRecoveryCycle(w, date){
    // Stage 0 means the word was missed today and is next due tomorrow.
    w.reviewStage = 0;
    w.nextReview = addDays(date, RECOVERY_INTERVALS[0]);
    w.lastInterval = RECOVERY_INTERVALS[0];
  }
  // 答對後：若仍在鞏固循環，就前往下一個間隔；完成第 30 天後改為 14 天維護。
  function scheduleAfterCorrectAnswer(w, date){
    var inRecovery = typeof w.reviewStage === "number" && w.reviewStage >= 0;
    var interval = CORRECT_REVIEW_INTERVAL;
    if(inRecovery){
      var nextStage = w.reviewStage + 1;
      if(nextStage < RECOVERY_INTERVALS.length){
        w.reviewStage = nextStage;
        interval = RECOVERY_INTERVALS[nextStage];
      } else {
        // The 30-day review has been completed; return to fortnightly maintenance.
        w.reviewStage = null;
      }
    }
    w.nextReview = addDays(date, interval);
    w.lastInterval = interval;
  }
  // 新增自訂字時建立本機唯一 ID，供佇列、排序與儲存資料比對使用。
  function uid(){ return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---------------- 儲存層：優先雲端 Artifact storage，其次瀏覽器 localStorage ----------------
  // 建立新使用者或讀取失敗時使用的最小資料結構。
  function defaultData(){ return { words: [], reviewLog: [], importedDecks: {}, studyCompletedDate: "" }; }

  // In-memory fallback used only if window.storage isn't available (e.g. the file
  // was opened outside Claude.ai). Keeps the app usable for the session, though
  // nothing will be remembered after the page is closed.
  var memoryFallbackStore = {};
  var usingMemoryFallback = false;
  // 判斷是否能使用宿主提供的持久化儲存 API。
  function hasRealStorage(){
    return typeof window !== "undefined" && window.storage &&
      typeof window.storage.get === "function" && typeof window.storage.set === "function";
  }

  // 安全測試瀏覽器 localStorage 是否可寫入（隱私模式可能拒絕）。
  function hasLocalStorage(){
    try{
      var testKey = "__vocab_library_test__";
      window.localStorage.setItem(testKey, "1");
      window.localStorage.removeItem(testKey);
      return true;
    }catch(e){
      return false;
    }
  }

  // "claude"  -> Claude.ai's built-in artifact storage (persists to your Claude account)
  // "local"   -> browser localStorage (persists on this device/browser, e.g. when hosted on GitHub Pages)
  // "memory"  -> in-memory only, lost when the tab closes (last-resort fallback)
  var storageBackend = "claude";

  // 向下相容舊資料：補齊新版欄位，避免舊 localStorage 導致畫面錯誤。
  function normalizeLoadedData(){
    if(!Array.isArray(data.words)) data.words = [];
    if(!Array.isArray(data.reviewLog)) data.reviewLog = [];
    if(!data.importedDecks || typeof data.importedDecks !== "object") data.importedDecks = {};
    if(typeof data.studyCompletedDate !== "string") data.studyCompletedDate = "";
    // Remove only retired built-in generated combinations.  Custom cards are
    // always preserved, and all remaining cards keep their review history.
    if(typeof isRetiredBuiltinTerm === "function"){
      data.words = data.words.filter(function(word){
        return word.category === "custom" || !isRetiredBuiltinTerm(word.en);
      });
    }
    // Correct earlier card data without touching review dates or answer history.
    data.words.forEach(function(word){
      if(word.en === "custommade"){
        word.en = "custom-made";
        word.zh = "訂製的";
        word.example = "He wears a custom-made suit for important meetings.";
        word.exampleZh = "他重要會議都穿訂製西裝。";
        word.pos = "adj.";
      }
      if(word.en === "automatic"){
        word.zh = "自動的";
        word.example = "The doors have an automatic sensor.";
        word.exampleZh = "這扇門有自動感應器。";
        word.pos = "adj.";
      }
    });
    // Update only generated filler examples and missing Chinese translations.
    // User-created cards keep their wording; all review scheduling fields remain intact.
    data.words.forEach(function(word){
      var deck = DECKS[word.category];
      if(!deck) return;
      var target = String(word.en || "").toLowerCase();
      // Correct only built-in generated terminology; custom cards retain the
      // exact wording that their owner entered.
      var renamedTarget = BUILTIN_WORD_RENAMES[target];
      if(word.category !== "custom" && renamedTarget){
        word.en = renamedTarget;
        target = String(renamedTarget).toLowerCase();
      }
      var match = deck.find(function(card){
        return String(card[0] || "").toLowerCase() === target;
      });
      if(!match) return;
      if(!String(word.exampleZh || "").trim() && String(match[3] || "").trim()){
        word.exampleZh = match[3];
      }
      var isLegacyFillerExample = (typeof isQualityLegacyFillerExample === "function")
        ? isQualityLegacyFillerExample(word.example)
        : /^(We discussed the .+ in today's meeting\.|We discussed the .+ during class\.|We discussed the .+ during today's lesson\.|We discussed the topic of .+ in class today\.|We learned how to .+ during today's lesson\.|The lesson included an? .+ example\.|The report includes information about the .+\.)$/.test(String(word.example || ""));
      // A curated multi-sense word must also refresh its primary example.
      // This lets an existing learner see the clarified meaning without
      // resetting their review history or touching their own custom cards.
      var hasCuratedVariants = !!EXAMPLE_VARIANTS[target];
      var hasCuratedExampleUpdate = !!CURATED_EXAMPLE_UPDATES[target];
      if(word.category !== "custom" && (isLegacyFillerExample || hasCuratedVariants || hasCuratedExampleUpdate) && match[2] !== word.example){
        word.zh = match[1];
        word.example = match[2];
        word.exampleZh = match[3];
        word.pos = match[4] || word.pos;
      }
      if(target.endsWith(" documentation") && String(word.zh || "").endsWith("\u6587\u4ef6\u5316")){
        word.zh = match[1];
      }
    });

    // Learners who had already imported the previous advanced deck should not
    // have to re-import it after synthetic phrases are retired. Add only the
    // 508 new replacement cards; keep every existing card and its progress.
    var hadAdvancedDeck = !!data.importedDecks.advanced || data.words.filter(function(word){
      return word.category === "advanced";
    }).length >= 1000;
    if(hadAdvancedDeck && typeof REAL_WORD_EXTENSION !== "undefined"){
      var existingWords = {};
      data.words.forEach(function(word){ existingWords[String(word.en || "").toLowerCase()] = true; });
      REAL_WORD_EXTENSION.forEach(function(entry){
        var key = String(entry[0] || "").toLowerCase();
        if(key && !existingWords[key]){
          var replacementCard = DECKS.advanced.find(function(card){
            return String(card[0] || "").toLowerCase() === key;
          });
          data.words.push(makeWord(
            entry[0], entry[1], replacementCard ? replacementCard[2] : "", todayStr(), "advanced",
            replacementCard ? replacementCard[3] : "", entry[2]
          ));
          existingWords[key] = true;
        }
      });
    }
  }

  // 依可用性載入資料；雲端失敗時自動改用本機或記憶體暫存。

  async function loadData(){
    if(hasRealStorage()){
      storageBackend = "claude";
      try{
        var res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){
          data = JSON.parse(res.value);
          normalizeLoadedData();
        } else {
          data = defaultData();
        }
      } catch(e){
        data = defaultData();
      }
      loaded = true;
      return;
    }

    if(hasLocalStorage()){
      storageBackend = "local";
      usingMemoryFallback = true; // reuse this flag to mean "not the Claude backend" for UI purposes
      try{
        var raw = window.localStorage.getItem(STORAGE_KEY);
        data = raw ? JSON.parse(raw) : defaultData();
        normalizeLoadedData();
      }catch(e){
        data = defaultData();
      }
      loaded = true;
      return;
    }

    storageBackend = "memory";
    usingMemoryFallback = true;
    data = (STORAGE_KEY in memoryFallbackStore) ? JSON.parse(memoryFallbackStore[STORAGE_KEY]) : defaultData();
    loaded = true;
  }

  var saveDebounceTimer = null;
  var pendingSaveResolvers = [];

  // 在無法長期保存時顯示一次性提醒，避免使用者誤以為進度已同步。
  function showFallbackNotice(){
    if(document.getElementById("save-error-banner")) return; // already showing
    var banner = document.createElement("div");
    banner.id = "save-error-banner";
    banner.className = "save-error-banner";
    banner.innerHTML =
      "⚠️ 目前這個環境的雲端存檔功能不太穩定，已經自動切換成「暫存在這個分頁」模式，你還是可以正常使用，只是關閉分頁後進度不會保留。建議到「學習紀錄」分頁按「⬇️ 匯出備份檔」把進度存成檔案，之後可以用「⬆️ 匯入備份檔」找回來。" +
      '<button id="save-error-dismiss">知道了</button>';
    document.body.appendChild(banner);
    document.getElementById("save-error-dismiss").onclick = function(){
      banner.remove();
    };
  }

  // 實際寫入目前 data；失敗時依序降級到 localStorage 或記憶體。
  async function performSave(){
    if(storageBackend === "local"){
      try{
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }catch(e){
        // localStorage suddenly unavailable (e.g. quota exceeded) — degrade further
        storageBackend = "memory";
        memoryFallbackStore[STORAGE_KEY] = JSON.stringify(data);
      }
      return;
    }
    if(storageBackend === "memory"){
      memoryFallbackStore[STORAGE_KEY] = JSON.stringify(data);
      return;
    }

    // storageBackend === "claude"
    var attempt = 0;
    while(attempt < 2){
      try{
        var res = await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
        if(res) return;
        attempt++;
      } catch(e){
        attempt++;
      }
      if(attempt < 2){
        await new Promise(function(r){ setTimeout(r, 600); });
      }
    }
    // window.storage.set kept failing (regardless of payload size) — stop fighting
    // a broken backend and degrade to localStorage (or memory) for the rest of
    // this session, so the app keeps working smoothly instead of erroring on
    // every future save.
    if(hasLocalStorage()){
      storageBackend = "local";
      try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
    } else {
      storageBackend = "memory";
      memoryFallbackStore[STORAGE_KEY] = JSON.stringify(data);
    }
    usingMemoryFallback = true;
    console.error("雲端儲存持續失敗，已自動切換為" + (storageBackend === "local" ? "瀏覽器本機儲存" : "本次分頁暫存") + "模式");
    showFallbackNotice();
  }

  // 將短時間內多次資料變更合併成一次寫入，避免觸發雲端儲存頻率限制。
  function saveData(){
    // Debounced + coalesced: many rapid calls (e.g. a full deck import, or a
    // fast run of review answers) collapse into a single write of the latest
    // in-memory state, instead of one storage request per change, which is
    // what was tripping the storage rate limit.
    return new Promise(function(resolve){
      pendingSaveResolvers.push(resolve);
      if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(async function(){
        saveDebounceTimer = null;
        var resolvers = pendingSaveResolvers;
        pendingSaveResolvers = [];
        await performSave();
        resolvers.forEach(function(r){ r(); });
      }, 500);
    });
  }

  // ---------------- 單字工具：出題格式、篩選條件與安全文字處理 ----------------
  // 找出今天或更早到期的卡片；逾期卡會持續留在待複習清單。
  function dueWords(){
    var t = todayStr();
    return data.words.filter(function(w){ return w.nextReview <= t; });
  }
  // 只要曾完成一次排程答對，即視為已學過；此狀態用於單字庫篩選與統計。
  function isKnown(w){ return w.box >= 1; }

  // 後續複習時，含多個例句的字卡會抽取一個例句出題。抽到的結果
  // 存在本輪 queue item 中，因此按提示或重畫畫面時不會突然換句子；
  // 下一次複習建立新 queue 後，才會重新隨機選擇。
  function getReviewExample(w, item){
    var examples = getReviewExamples(w);
    if(!examples.length) return null;
    if(examples.length === 1) return examples[0];
    if(!item) return examples[Math.floor(Math.random() * examples.length)];
    if(typeof item.exampleIndex !== "number" || item.exampleIndex < 0 || item.exampleIndex >= examples.length){
      item.exampleIndex = Math.floor(Math.random() * examples.length);
    }
    return examples[item.exampleIndex];
  }
  // Match a regular plural as well as the base word. This keeps a sentence
  // such as "talking in abstractions" grammatically complete after the learner
  // fills the blank, while the card itself remains filed under "abstraction".
  function getPromptWordRegExp(word){
    var text = String(word || "").trim();
    var optionalPlural = text.indexOf(" ") === -1 && !/s$/i.test(text) ? "s?" : "";
    return new RegExp("\\b" + escapeRegExp(text) + optionalPlural + "\\b", "i");
  }
  // 優先用例句挖空出題；沒有例句時退回「中文意思＋字首提示」模式。
  function buildPrompt(w, selectedExample){
    var exampleText = selectedExample && selectedExample.example ? selectedExample.example : w.example;
    var exampleZh = selectedExample && selectedExample.exampleZh ? selectedExample.exampleZh : w.exampleZh;
    var re = null;
    if(exampleText){
      try{
        re = getPromptWordRegExp(w.en);
      }catch(e){ re = null; }
    }
    var hintLen = w.en.length;
    var hintText = w.en[0].toUpperCase() + " " + "_ ".repeat(Math.max(hintLen-1,0)).trim();
    if(exampleText && re && re.test(exampleText)){
      var matchedAnswer = exampleText.match(re)[0];
      var htmlSentence = escapeHtml(exampleText).replace(re,
        '<span class="blank-slot">&nbsp;</span>');
      return { kind: "sentence", html: htmlSentence, hint: hintText, zhSentence: exampleZh || "", answer: matchedAnswer };
    }
    return { kind: "meaning", zh: w.zh, hint: hintText };
  }
  // 將使用者輸入與字庫文字轉義後再插入 HTML，避免內容被當成網頁標籤執行。
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  // 將單字轉義成可安全放入正規表示式的字串。
  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // 使用瀏覽器內建語音合成朗讀英文；不支援的環境會靜默略過。
  function speak(text){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech synthesis unavailable, fail silently */ }
  }

  // 在單字庫卡片背面標示例句中的目標單字。
  function highlightWord(sentence, word){
    try{
      var re = getPromptWordRegExp(word);
      return escapeHtml(sentence).replace(re, function(m){ return '<strong class="hl-word">' + m + '</strong>'; });
    }catch(e){ return escapeHtml(sentence); }
  }

  // 解析批次匯入文字：維持舊格式「英文|中文|例句|例句翻譯」，最末可加第 5 欄詞性。
  // 因此原有 2～4 欄匯入檔完全相容；詞性可寫 n.／v.、adj.、phr.v. 等。
  function parseBulkWordList(text){
    var lines = text.split(/\r?\n/);
    var parsed = [];
    var skipped = 0;
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      var parts = line.split("|").map(function(s){ return s.trim(); });
      if(parts.length < 2 || !parts[0] || !parts[1]){ skipped++; return; }
      parsed.push({ en: parts[0], zh: parts[1], example: parts[2] || "", exampleZh: parts[3] || "", pos: parts[4] || "" });
    });
    return { parsed: parsed, skipped: skipped };
  }

  // ---------------- 複習作答：建立今日佇列、評分、重練與排程 ----------------
  // 建立今日最多 DAILY_TARGET 題的佇列；到期卡優先，不足時以額外練習補滿。
  function startSession(){
    var t = todayStr();
    var due = data.words.filter(function(w){ return w.nextReview <= t; });
    shuffle(due);
    var dueSelected = due.slice(0, DAILY_TARGET);
    var queueItems = dueSelected.map(function(w){ return { id: w.id, bonus: false }; });

    // top up to the daily target with bonus practice pulled from the rest of the word bank
    var remainingSlots = DAILY_TARGET - queueItems.length;
    if(remainingSlots > 0){
      var usedIds = {};
      dueSelected.forEach(function(w){ usedIds[w.id] = true; });
      var pool = data.words.filter(function(w){ return !usedIds[w.id]; });
      shuffle(pool);
      pool.slice(0, remainingSlots).forEach(function(w){
        queueItems.push({ id: w.id, bonus: true });
      });
    }
    shuffle(queueItems);

    session = {
      queue: queueItems,
      redrillsLeft: {},
      correctCount: 0,
      wrongCount: 0,
      totalDue: due.length,
      totalBonus: queueItems.filter(function(q){ return q.bonus; }).length,
      totalSession: queueItems.length,
      finished: queueItems.length === 0
    };
  }
  // Fisher-Yates 洗牌；直接改動傳入陣列的順序。
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
  }

  // 取得目前佇列第一題的中介資料（含 bonus／redrill 標記）。
  function currentItem(){
    if(!session || session.queue.length === 0) return null;
    return session.queue[0];
  }
  // 依目前題目的 ID 從使用者已擁有的單字資料找出完整卡片。
  function currentWord(){
    var item = currentItem();
    if(!item) return null;
    return data.words.find(function(w){ return w.id === item.id; });
  }

  // 處理一次作答：更新答題歷史、當日統計與下次複習日，最後儲存資料。
  async function submitAnswer(userInput, opts){
    var item = currentItem();
    var w = currentWord();
    if(!item || !w) return null;
    opts = opts || {};
    var expectedAnswer = String(opts.expectedAnswer || w.en).trim().toLowerCase();
    var typedCorrect = userInput.trim().toLowerCase() === expectedAnswer;
    var correct = opts.forceWrong ? false : typedCorrect;
    var needsReview = opts.forceReview || !correct; // hint/answer usage follows the same recovery path as an incorrect answer
    var t = todayStr();

    if(!item.bonus && !item.redrill){
      // Only a scheduled review changes the future plan. Same-day redrills are
      // for reinforcement and must not advance the recovery sequence.
      if(!needsReview){
        w.box = w.box + 1;
        w.streak = (w.streak||0) + 1;
        scheduleAfterCorrectAnswer(w, t);
      } else {
        w.box = 0;
        w.streak = 0;
        startRecoveryCycle(w, t);
      }
    }
    // Bonus items and same-day redrills never change the word's schedule.
    if(!correct){ w.wrongTotal = (w.wrongTotal||0) + 1; }
    if(opts.forceReview){ w.helpCount = (w.helpCount||0) + 1; }
    if(correct) session.correctCount++; else session.wrongCount++;

    session.queue.shift();
    if(!correct || opts.forceReview){
      // requeue for a redrill later in this session, up to MAX_REDRILL times
      var left = session.redrillsLeft[item.id] === undefined ? MAX_REDRILL : session.redrillsLeft[item.id];
      if(left > 0){
        session.redrillsLeft[item.id] = left - 1;
        var insertAt = Math.min(session.queue.length, 2);
        session.queue.splice(insertAt, 0, { id: item.id, bonus: item.bonus, redrill: true });
      }
    }
    w.history = w.history || [];
    w.history.push({ date: t, correct: correct });
    if(w.history.length > 40) w.history = w.history.slice(-40);

    if(session.queue.length === 0) session.finished = true;

    // update today's review log
    var log = data.reviewLog.find(function(l){ return l.date === t; });
    if(!log){ log = { date: t, correct: 0, total: 0 }; data.reviewLog.push(log); }
    log.total++;
    if(correct) log.correct++;

    await saveData();
    return correct;
  }

  // ---------------- 畫面渲染：今日複習分頁 ----------------
  // 依載入、空清單、完成與作答中四種狀態重新產生複習畫面。
  function renderReview(){
    if(!loaded){
      reviewEl.innerHTML = '<div class="center-note"><span class="spinner"></span>載入資料中…</div>';
      return;
    }
    if(!session) startSession();

    if(session.totalSession === 0){
      reviewEl.innerHTML =
        '<div class="center-note">' +
          '<div class="big">單字庫是空的</div>' +
          '<p>去「單字庫」匯入字庫，或自己新增單字，就能開始每天 ' + DAILY_TARGET + ' 題的例句練習。</p>' +
        '</div>';
      return;
    }

    if(session.finished){
      var acc = session.correctCount + session.wrongCount > 0
        ? Math.round(100*session.correctCount/(session.correctCount+session.wrongCount)) : 0;
      reviewEl.innerHTML =
        '<div class="center-note">' +
          '<div class="big">今天的複習完成了 ✓</div>' +
          '<p>本次共練習 ' + session.totalSession + ' 題（到期複習 ' + session.totalDue + ' 題、額外練習 ' + session.totalBonus + ' 題），答對率 ' + acc + '%。</p>' +
          '<button class="ghost" id="restart-session">再練習一輪</button>' +
        '</div>';
      document.getElementById("restart-session").onclick = function(){
        session = null; renderReview();
      };
      return;
    }

    var item = currentItem();
    var w = currentWord();
    var prompt = buildPrompt(w, getReviewExample(w, item));
    var remaining = session.queue.length;
    var doneSoFar = session.totalSession - remaining;
    var cardState = { hintUsed: false, answerUsed: false };
    var itemLabel = item.bonus ? " · 額外練習" : (item.redrill ? " · 當日加強複習" : " · 到期複習");

    var promptHtml;
    if(prompt.kind === "sentence"){
      var zhLine = prompt.zhSentence
        ? '<div class="sentence-zh">' + escapeHtml(prompt.zhSentence) + '</div>'
        : '<div class="sentence-zh sentence-zh-fallback">（' + escapeHtml(w.zh) + '）</div>';
      promptHtml =
        '<div class="prompt-kind">例句填空 · Fill in the blank</div>' +
        '<div class="sentence">' + prompt.html + '</div>' +
        zhLine;
    } else {
      promptHtml =
        '<div class="prompt-kind">中文提示 · Meaning prompt</div>' +
        '<div class="meaning-line">' + escapeHtml(prompt.zh) + '</div>';
    }

    reviewEl.innerHTML =
      '<div class="stat-strip">' +
        statBox(doneSoFar + ' / ' + session.totalSession, "今日進度") +
        statBox(session.correctCount, "答對") +
        statBox(session.wrongCount, "答錯") +
        statBox(session.totalDue, "到期複習") +
      '</div>' +
      '<div class="card-wrap"><div class="lib-card">' +
        '<div class="lib-card-head"><span>' + (DECK_META[w.category] || DECK_META.custom).label.toUpperCase() + itemLabel + '</span><span>BOX ' + (w.box===0?"NEW":"KNOWN") + '</span></div>' +
        '<div class="lib-card-body">' +
          promptHtml +
          '<div class="hint-line" id="hint-zone" hidden></div>' +
          '<div class="help-row">' +
            '<button class="ghost" id="hint-btn">💡 提示</button>' +
            '<button class="ghost" id="answer-btn">🙈 顯示答案</button>' +
          '</div>' +
          '<div class="answer-row">' +
            '<input id="answer-input" type="text" autocomplete="off" placeholder="輸入英文單字…" />' +
            '<button class="primary" id="submit-btn">送出</button>' +
          '</div>' +
          '<div id="feedback-zone"></div>' +
          '<div class="queue-note">此單字目前答對連續次數：' + (w.streak||0) + '　·　目前累積答錯：' + (w.wrongTotal||0) + '　·　使用過提示／答案：' + (w.helpCount||0) + ' 次</div>' +
        '</div>' +
      '</div></div>';

    var input = document.getElementById("answer-input");
    var btn = document.getElementById("submit-btn");
    var hintBtn = document.getElementById("hint-btn");
    var answerBtn = document.getElementById("answer-btn");
    var hintZone = document.getElementById("hint-zone");
    input.focus();

    hintBtn.onclick = function(){
      cardState.hintUsed = true;
      hintZone.hidden = false;
      hintZone.textContent = "提示：" + prompt.hint;
      hintBtn.disabled = true;
    };
    answerBtn.onclick = function(){
      cardState.hintUsed = true;
      cardState.answerUsed = true;
      hintZone.hidden = false;
      hintZone.textContent = "答案：" + (prompt.answer || w.en);
      input.value = prompt.answer || w.en;
      input.disabled = true;
      hintBtn.disabled = true;
      answerBtn.disabled = true;
      btn.textContent = "下一題 →";
    };

    function doSubmit(){
      var val = input.value;
      if(!val.trim()) return;
      btn.disabled = true; input.disabled = true; hintBtn.disabled = true; answerBtn.disabled = true;
      var opts = { forceReview: cardState.hintUsed || cardState.answerUsed, forceWrong: cardState.answerUsed, expectedAnswer: prompt.answer || w.en };
      submitAnswer(val, opts).then(function(correct){
        var w2 = data.words.find(function(x){ return x.id === w.id; });
        var fb = document.getElementById("feedback-zone");
        var practiceOnly = item.bonus || item.redrill;
        var practiceLabel = item.redrill ? "當日加強複習" : "額外練習";
        var helpNote = opts.forceReview ? "　·　用了提示／答案，已啟動記憶鞏固循環" : "";
        if(correct){
          fb.innerHTML = practiceOnly
            ? '<div class="feedback correct"><span class="stamp">✓ 答對</span> ' + practiceLabel + '，不影響後續複習排程</div>'
            : '<div class="feedback correct"><span class="stamp">✓ 答對</span> 下次複習：' + w2.nextReview + '（' + w2.lastInterval + ' 天後）' + helpNote + '</div>';
        } else {
          fb.innerHTML = practiceOnly
            ? '<div class="feedback wrong"><span class="stamp">✕ 再加油</span> 正確答案：' + escapeHtml(w.en) + '　·　' + practiceLabel + '，不影響後續複習排程</div>'
            : '<div class="feedback wrong"><span class="stamp">✕ 再加油</span> 正確答案：' + escapeHtml(w.en) + '　·　記憶鞏固循環已開始，明天再複習一次</div>';
        }
        setTimeout(function(){ renderReview(); }, 900);
      });
    }
    btn.onclick = doSubmit;
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") doSubmit(); });
  }

  // 建立可重用的小型統計方塊 HTML。
  function statBox(num, lbl){
    return '<div class="stat-box"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  // ---------------- 畫面渲染：單字庫分頁與匯入功能 ----------------
  // 顯示字庫進度、篩選後的翻卡清單，以及自訂／批次匯入表單。
  function renderBank(){
    if(!loaded){
      bankEl.innerHTML = '<div class="center-note"><span class="spinner"></span>載入資料中…</div>';
      return;
    }
    var deckCards = Object.keys(DECKS).map(function(key){
      var meta = DECK_META[key];
      var count = DECKS[key].length;
      var ownedCount = data.words.filter(function(w){ return w.category === key; }).length;
      var complete = ownedCount >= count;
      var partial = ownedCount > 0 && !complete;
      var btnLabel = "匯入";
      return '<div class="deck-card' + (complete ? " imported" : "") + '">' +
        '<div class="deck-card-top">' +
          '<span class="deck-name">' + meta.label + '</span>' +
          '<span class="deck-count">' + ownedCount + ' / ' + count + ' 字</span>' +
        '</div>' +
        '<p class="deck-desc">' + meta.desc + '</p>' +
        (complete
          ? '<span class="deck-done">✓ 已全部匯入</span>'
          : '<button class="primary deck-import-btn" data-deck="' + key + '">' + btnLabel + '</button>') +
      '</div>';
    }).join("");

    var totalDeckWordCount = Object.keys(DECKS).reduce(function(total, key){
      return total + DECKS[key].length;
    }, 0);

    var syncableCount = data.words.filter(function(w){
      if(w.example) return false;
      var deck = DECKS[w.category];
      if(!deck) return false;
      var match = deck.find(function(d){ return d[0] === w.en; });
      return !!(match && match[2]);
    }).length;

    var deckSection =
      '<div class="deck-grid-wrap">' +
        '<div class="chart-title">匯入單字庫（依難度分組，共 ' + totalDeckWordCount + ' 字）</div>' +
        '<div class="deck-grid">' + deckCards + '</div>' +
        (syncableCount > 0
          ? '<div class="sync-row"><button class="ghost" id="sync-examples-btn">🔄 幫我已收藏的單字補上新例句（' + syncableCount + ' 個可更新）</button></div>'
          : '') +
      '</div>';

    var bulkSection =
      '<div class="bulk-wrap">' +
        '<div class="chart-title">批次匯入你自己的單字清單</div>' +
        '<p class="form-hint bulk-format-hint">' +
          '每行一個單字，用直線符號「|」分隔：<code>英文單字|中文意思|例句(選填)|例句中文翻譯(選填)|詞性(選填)</code><br>' +
          '例：<code>ambiguous|模稜兩可的|Her answer was ambiguous.|她的回答模稜兩可。|adj.</code>　保留原本的「英文|中文」或四欄格式也完全相容。<br>' +
          '一次貼上幾千字都沒問題；如果你的清單真的很大，建議先只填「英文｜中文」，例句留空可以讓資料量小一點、儲存更穩定。' +
        '</p>' +
        '<textarea id="bulk-textarea" class="bulk-textarea" placeholder="ambiguous|模稜兩可的\nresilient|有韌性的\ncandid|坦率的"></textarea>' +
        '<div class="form-actions bulk-actions">' +
          '<label class="ghost bulk-upload-label">' +
            '📁 上傳 .txt / .csv 檔<input type="file" id="bulk-file-input" accept=".txt,.csv" hidden>' +
          '</label>' +
          '<button class="primary" id="bulk-import-btn">批次加入單字庫</button>' +
          '<span class="form-hint" id="bulk-result"></span>' +
        '</div>' +
      '</div>';

    var categories = ["all"].concat(Object.keys(DECK_META));
    var filterBtns = categories.map(function(c){
      var label = c === "all" ? "全部分類" : DECK_META[c].label;
      var active = bankFilter === c ? " active" : "";
      return '<button class="filter-btn' + active + '" data-filter="' + c + '">' + label + '</button>';
    }).join("");

    var statusOptions = [
      { key: "all", label: "全部" },
      { key: "new", label: "🟡 還沒學" },
      { key: "known", label: "🟢 已經學會" }
    ];
    var statusBtns = statusOptions.map(function(s){
      var active = bankStatusFilter === s.key ? " active" : "";
      return '<button class="filter-btn status-filter-btn' + active + '" data-status="' + s.key + '">' + s.label + '</button>';
    }).join("");

    // 詞性篩選同時支援多詞性卡，例如 record 的 n.／v. 會出現在兩種篩選下。
    var posOptions = [
      { key: "all", label: "全部詞性" }, { key: "n.", label: "n. 名詞" },
      { key: "v.", label: "v. 動詞" }, { key: "adj.", label: "adj. 形容詞" },
      { key: "adv.", label: "adv. 副詞" }, { key: "prep.", label: "prep. 介系詞" },
      { key: "conj.", label: "conj. 連接詞" }, { key: "pron.", label: "pron. 代名詞" },
      { key: "quant.", label: "quant. 數量詞" }, { key: "phr.v.", label: "phr.v. 動詞片語" },
      { key: "idiom", label: "idiom 慣用語" }, { key: "未標註", label: "未標註" }
    ];
    var posBtns = posOptions.map(function(option){
      var active = bankPosFilter === option.key ? " active" : "";
      return '<button class="filter-btn' + active + '" data-pos="' + option.key + '">' + option.label + '</button>';
    }).join("");

    // 將正在使用的進階條件濃縮成一行，面板收起時仍能清楚知道目前篩了什麼。
    var activeFilterLabels = [];
    if(bankStatusFilter !== "all"){
      var activeStatus = statusOptions.filter(function(option){ return option.key === bankStatusFilter; })[0];
      if(activeStatus) activeFilterLabels.push(activeStatus.label);
    }
    if(bankPosFilter !== "all"){
      var activePos = posOptions.filter(function(option){ return option.key === bankPosFilter; })[0];
      if(activePos) activeFilterLabels.push(activePos.label);
    }
    if(bankFilter !== "all") activeFilterLabels.push(DECK_META[bankFilter].label);
    var activeFilterCount = activeFilterLabels.length;
    var filterSummary = activeFilterCount
      ? '<span class="filter-summary">目前篩選：' + activeFilterLabels.join(' · ') + '</span>'

    var filterPanel =
      '<div class="filter-panel"' + (bankFiltersOpen ? '' : ' hidden') + '>' +

      '</div>';

    var visibleWords = data.words.filter(function(w){
      var catOk = bankFilter === "all" || (w.category || "custom") === bankFilter;
      var statusOk = bankStatusFilter === "all" ||
        (bankStatusFilter === "new" ? w.box === 0 : w.box > 0);
      var posOk = hasPartOfSpeech(getPartOfSpeech(w.en, w.pos), bankPosFilter);
      return catOk && statusOk && posOk;
    });

    var orderedWords = visibleWords.slice().sort(function(a,b){ return a.nextReview < b.nextReview ? -1 : 1; });
    if(bankOrderIds){
      var posMap = {};
      bankOrderIds.forEach(function(id, i){ posMap[id] = i; });
      orderedWords.sort(function(a,b){
        var pa = posMap[a.id] === undefined ? 9999 : posMap[a.id];
        var pb = posMap[b.id] === undefined ? 9999 : posMap[b.id];
        return pa - pb;
      });
    }

    var cards = orderedWords.map(function(w){
        var isKnown = w.box > 0;
        var badgeClass = isKnown ? "cycle" : "new";
        var badgeText = isKnown ? ("×" + w.box) : "NEW";
        var statusClass = isKnown ? "status-known" : "status-new";
        var catLabel = (DECK_META[w.category] || DECK_META.custom).label;
        var posLabel = getPartOfSpeech(w.en, w.pos);
        var posClass = posLabel === "未標註" ? " pending" : "";
        var helpBadge = w.helpCount ? '<span class="fc-help">💡×' + w.helpCount + '</span>' : "";

        var multiSenseClass = isMultiSense ? ' multi-sense-card' : "";
        var multiSenseStyle = isMultiSense ? ' style="--sense-card-height:' + getMultiSenseCardHeight(cardExamples) + 'px"' : "";

    bankEl.innerHTML =

          '<div class="filter-row status-row">' + statusBtns + '</div>' +
