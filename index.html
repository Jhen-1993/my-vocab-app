    var shuffleBtn = document.getElementById("shuffle-btn");
    if(shuffleBtn){
      shuffleBtn.onclick = function(){
        var ids = orderedWords.map(function(w){ return w.id; });
        shuffle(ids);
        bankOrderIds = ids;
        renderBank();
      };
    }

    // 展開或收起詞性與分類，不改變已選條件；使用者可放心查看其他篩選項目。
    var filterToggleBtn = document.getElementById("filter-toggle-btn");

    }

    // 一鍵回到完整單字庫，同時保留目前的卡片排序，避免不必要的畫面跳動。
    var filterResetBtn = document.getElementById("filter-reset-btn");
    if(filterResetBtn){
      filterResetBtn.onclick = function(){

        bankPosFilter = "all";

      };

    var bulkFileInput = document.getElementById("bulk-file-input");
    var bulkTextarea = document.getElementById("bulk-textarea");
    if(bulkFileInput){
      bulkFileInput.onchange = function(){
        var file = bulkFileInput.files && bulkFileInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          bulkTextarea.value = e.target.result;
        };
        reader.onerror = function(){
          document.getElementById("bulk-result").textContent = "檔案讀取失敗，請改用貼上文字的方式。";
        };
        reader.readAsText(file, "UTF-8");
      };
    }

    var bulkImportBtn = document.getElementById("bulk-import-btn");
    if(bulkImportBtn){
      bulkImportBtn.onclick = async function(){
        var raw = bulkTextarea.value;
        if(!raw || !raw.trim()){
          document.getElementById("bulk-result").textContent = "請先貼上或上傳單字清單。";
          return;
        }
        bulkImportBtn.disabled = true;
        var result = parseBulkWordList(raw);
        var existingEn = {};
        data.words.forEach(function(w){ existingEn[w.en.toLowerCase()] = true; });
        var added = 0, dupes = 0;
        var t = todayStr();
        result.parsed.forEach(function(item){
          var key = item.en.toLowerCase();
          if(existingEn[key]){ dupes++; return; }
          existingEn[key] = true;
          data.words.push(makeWord(item.en, item.zh, item.example, t, "bulk", item.exampleZh, item.pos));
          added++;
        });
        await saveData();
        session = null;
        bulkTextarea.value = "";
        renderBank();
        var resultEl = document.getElementById("bulk-result");
        if(resultEl){
          resultEl.textContent = "成功加入 " + added + " 個單字" +
            (dupes ? "，略過重複 " + dupes + " 個" : "") +

    Array.prototype.forEach.call(document.querySelectorAll(".flip-card"), function(card){

      });
    });

    Array.prototype.forEach.call(document.querySelectorAll(".speak-btn"), function(btn){

    Array.prototype.forEach.call(document.querySelectorAll(".fc-del"), function(btn){
      btn.addEventListener("click", async function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        data.words = data.words.filter(function(w){ return w.id !== id; });
        await saveData();
        session = null;
        renderBank();
      });
    });

    var syncBtn = document.getElementById("sync-examples-btn");
    if(syncBtn){
      syncBtn.onclick = async function(){
        syncBtn.disabled = true;
        var updated = 0;
        data.words.forEach(function(w){
          if(w.example) return;
          var deck = DECKS[w.category];
          if(!deck) return;
          var match = deck.find(function(d){ return d[0] === w.en; });
          if(match && match[2]){
            w.example = match[2];
            w.exampleZh = match[3] || "";
            updated++;
          }
        });
        await saveData();
        session = null;
        renderBank();
      };
    }

    Array.prototype.forEach.call(document.querySelectorAll(".deck-import-btn"), function(btn){
      btn.onclick = async function(){
        var key = btn.getAttribute("data-deck");
        btn.disabled = true;
        var t = todayStr();
        var existingEn = data.words.filter(function(w){ return w.category === key; })
          .map(function(w){ return w.en.toLowerCase(); });
        DECKS[key].forEach(function(item){
          if(existingEn.indexOf(item[0].toLowerCase()) === -1){
            data.words.push(makeWord(item[0], item[1], item[2], t, key, item[3]));
          }
        });
        data.importedDecks[key] = true;
        session = null;
        await saveData();
        renderBank();
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll(".filter-btn[data-filter]"), function(btn){
      btn.onclick = function(){
        bankFilter = btn.getAttribute("data-filter");
        renderBank();
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll(".filter-btn[data-status]"), function(btn){
      btn.onclick = function(){
        bankStatusFilter = btn.getAttribute("data-status");
        renderBank();
      };
    });

    Array.prototype.forEach.call(document.querySelectorAll(".filter-btn[data-pos]"), function(btn){
      btn.onclick = function(){
        bankPosFilter = btn.getAttribute("data-pos");
        renderBank();
      };
    });

    document.getElementById("add-word-form").onsubmit = async function(e){
      e.preventDefault();
      var en = document.getElementById("f-en").value.trim();
      var zh = document.getElementById("f-zh").value.trim();
      var example = document.getElementById("f-example").value.trim();
      var exampleZh = document.getElementById("f-example-zh").value.trim();
      if(!en || !zh) return;
      var pos = document.getElementById("f-pos").value.trim();
      data.words.push(makeWord(en, zh, example, todayStr(), "custom", exampleZh, pos));
      await saveData();
      session = null;
      renderBank();
    };
  }

  // 將字庫或表單輸入正規化為使用者進度資料的一張可排程單字卡。
  function makeWord(en, zh, example, today, category, exampleZh, pos){
    return {
      id: uid(), en: en, zh: zh, example: example || "", exampleZh: exampleZh || "",
      // 自訂詞性優先；未指定時查詢獨立詞性表，確保舊資料與既有字庫不需改欄位。
      pos: getPartOfSpeech(en, pos),
      category: category || "custom",
      box: 0, streak: 0, wrongTotal: 0, reviewStage: null,
      nextReview: today, lastInterval: 0,
      history: [], addedAt: today
    };
  }

  // ---------------- 口說練習：情境設定、語音輸入與 AI Relay 對話 ----------------

  // 口說模組的暫存狀態；只保留在目前分頁，對話歷史不寫入學習紀錄。
  var speakScenarioKey = null;

  var speakTurns = [];        // rendered turn records for the UI (mirrors history + correction info)

  // 清理使用者貼上的 Worker URL，移除尾端斜線以確保 API 路徑組合一致。
  function normalizeRelayUrl(value){
    return String(value || "").trim().replace(/\/+$/, "");
  }

  // 從 localStorage 讀取口說 Relay 設定；此處只存 Worker URL 與存取密碼。
  function loadSpeakRelay(){
    try{
      var raw = window.localStorage.getItem(SPEAK_RELAY_STORAGE_KEY);
      if(!raw) return null;
      var saved = JSON.parse(raw);
      if(!saved || !/^https:\/\//i.test(saved.url || "")) return null;
      return {
        url: normalizeRelayUrl(saved.url),
        provider: saved.provider === "anthropic" ? "anthropic" : "openai",
        accessToken: typeof saved.accessToken === "string" ? saved.accessToken : ""
      };
    }catch(e){
      return null;
    }
  }

  // 儲存口說 Relay 設定，供下次開啟頁面時沿用。
  function saveSpeakRelay(config){
    speakRelay = config;
    try{
      window.localStorage.setItem(SPEAK_RELAY_STORAGE_KEY, JSON.stringify(config));
    }catch(e){}
  }

  // 移除已儲存的 Relay 設定，不會影響雲端 Worker 本身。
  function forgetSpeakRelay(){
    speakRelay = null;
    try{ window.localStorage.removeItem(SPEAK_RELAY_STORAGE_KEY); }catch(e){}
  }

  // 判斷是否已完成可用的 Relay 設定。
  function hasSpeakRelay(){
    return !!(speakRelay && /^https:\/\//i.test(speakRelay.url || ""));

  // Relay 尚未設定時產生可複製提示詞，讓使用者可改用其他聊天工具練習。
  function manualSpeakPrompt(scenario){
    return "Please role-play as " + scenario.role + " in a spoken English practice conversation with a Traditional-Chinese-speaking English learner. " +
      "Start with this opener: \"" + scenario.opener + "\"\n\n" +
      "Keep each reply natural, warm, and short (1–3 sentences) for a B1–B2 learner. After each learner reply, provide: " +
      "(1) your English role-play reply, (2) its Traditional Chinese translation, and (3) a brief correction only when needed, including a more natural English version and a Traditional Chinese explanation. " +
      "Continue the conversation by asking a relevant follow-up question.";
  }

  // 優先用 Clipboard API 複製文字；不支援時改用暫時 textarea。
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    try{ document.execCommand("copy"); }finally{ textarea.remove(); }
    return Promise.resolve();
  }

  // 呈現 Relay URL、存取密碼與供應商設定表單。

            '<div class="speak-setup-step"><span class="speak-setup-step-num">1</span><div><strong>取得自己的 API key</strong><br>這是 AI 供應商用來計算你個人額度的金鑰。<a href="' + apiKeyUrl + '" target="_blank" rel="noopener">前往 ' + speakProviderLabel(provider) + ' 建立 API key ↗</a></div></div>' +

      var url = normalizeRelayUrl(document.getElementById("speak-relay-url").value);

      if(!/^https:\/\//i.test(url)){
        result.textContent = "請輸入以 https:// 開頭的 Relay 網址。";
        return;
      }
      result.textContent = "正在測試連線…";
      try{

        if(!health.ok) throw new Error("Relay 沒有回應健康檢查（HTTP " + health.status + "）。");
        var info = await health.json();
        var detectedProvider = info && info.provider === "anthropic" ? "anthropic" : provider;

      }
    };
  }

  // 初始化指定情境的對話歷史，並切換到對話介面。
  function startSpeakScenario(key){
    if(!hasSpeakRelay()){
      openSpeakSetup(key);
      return;
    }
    speakScenarioKey = key;
    speakHistory = [];
    speakTurns = [];
    speakLoading = false;
    renderSpeakConversation();
  }

  // 結束目前口說對話並清空只屬於本次分頁的對話狀態。
  function endSpeakConversation(){
    speakScenarioKey = null;
    speakHistory = [];
    speakTurns = [];
    if(speakRecognition && speakListening){
      try{ speakRecognition.stop(); }catch(e){}
    }
    speakListening = false;
    renderSpeak();
  }

  // 偵測瀏覽器的 Web Speech API；不可用時保留鍵盤輸入功能。
  function setupSpeakMic(input){
    var micBtn = document.getElementById("speak-mic-btn");
    var hint = document.getElementById("speak-mic-hint");
    var SpeechRecCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecCtor){
      micBtn.disabled = true;
      micBtn.classList.add("speak-mic-unavailable");
      hint.textContent = "這個瀏覽器不支援語音輸入，請直接打字回覆。";
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micBtn.disabled = true;
      micBtn.classList.add("speak-mic-unavailable");
      hint.textContent = "目前這個環境不允許使用麥克風（常見於 App 內建瀏覽器），請直接打字回覆。";
      return;
    }

    micBtn.onclick = function(){
      if(speakListening){
        try{ speakRecognition.stop(); }catch(e){}
        return;
      }

      micBtn.disabled = true;
      hint.textContent = "正在請求麥克風權限…";

      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        // permission granted — release this test stream immediately, the
        // SpeechRecognition API will open its own audio session
        stream.getTracks().forEach(function(t){ t.stop(); });
        micBtn.disabled = false;
        startSpeakRecognition(SpeechRecCtor, micBtn, hint, input);
      }).catch(function(err){
        micBtn.disabled = false;
        if(err && err.name === "NotAllowedError"){
          hint.textContent = "麥克風權限被拒絕了。請在瀏覽器的網站設定裡允許麥克風，或直接打字回覆。";
        } else if(err && err.name === "NotFoundError"){
          hint.textContent = "偵測不到麥克風裝置，請直接打字回覆。";
        } else {
          hint.textContent = "目前這個環境不允許使用麥克風（常見於 App 內建瀏覽器），請直接打字回覆。";
        }
      });
    };
  }

  // 啟動單次英文語音辨識，將辨識結果寫入目前對話輸入框。
  function startSpeakRecognition(SpeechRecCtor, micBtn, hint, input){
    var started = false;
    var startTimeout = setTimeout(function(){
      if(!started){
        try{ speakRecognition.stop(); }catch(e){}
        micBtn.classList.remove("speak-mic-active");
        hint.textContent = "麥克風沒有回應，這個環境可能不支援語音輸入，請直接打字回覆。";
      }
    }, 3000);

    try{
      speakRecognition = new SpeechRecCtor();
      speakRecognition.lang = "en-US";
      speakRecognition.interimResults = false;
      speakRecognition.maxAlternatives = 1;
      speakRecognition.onstart = function(){
        started = true;
        clearTimeout(startTimeout);
        speakListening = true;
        micBtn.classList.add("speak-mic-active");
        hint.textContent = "聽你說…請開始說英文";
      };
      speakRecognition.onresult = function(e){
        var text = e.results[0][0].transcript;
        input.value = text;
      };
      speakRecognition.onerror = function(e){
        clearTimeout(startTimeout);
        var code = e && e.error;
        if(code === "not-allowed" || code === "service-not-allowed"){
          hint.textContent = "麥克風權限被拒絕了，請直接打字回覆。";
        } else if(code === "no-speech"){
          hint.textContent = "沒有偵測到說話聲，請再試一次或直接打字。";
        } else if(code === "network"){
          hint.textContent = "語音辨識連線失敗，請直接打字回覆。";
        } else {
          hint.textContent = "語音辨識發生問題（" + (code || "未知錯誤") + "），請直接打字回覆。";
        }
      };
      speakRecognition.onend = function(){
        clearTimeout(startTimeout);
        speakListening = false;
        micBtn.classList.remove("speak-mic-active");
        if(hint.textContent === "聽你說…請開始說英文") hint.textContent = "";
      };
      speakRecognition.start();
    }catch(e){
      clearTimeout(startTimeout);
      hint.textContent = "無法啟動語音輸入，請直接打字回覆。";
    }
  }

  // 將使用者訊息加到畫面，再向 Relay 請求 AI 回覆與修正文句。
  async function submitSpeakMessage(userText){
    var scenario = SPEAK_SCENARIOS[speakScenarioKey];
    var turn = { userText: userText, reply: "", replyZh: "", hasIssues: false, better: "", note: "" };
    speakTurns.push(turn);
    speakLoading = true;
    renderSpeakConversation();

    try{
      var result = await callSpeakTurn(scenario, speakHistory, userText);
      turn.reply = result.reply || "";
      turn.replyZh = result.replyZh || "";
      turn.hasIssues = !!result.hasIssues;
      turn.better = result.better || "";
      turn.note = result.note || "";
      speakHistory.push({ role: "user", text: userText });
      speakHistory.push({ role: "assistant", text: turn.reply || "..." });
    }catch(e){
      turn.reply = "（暫時無法取得 AI 回覆：" + ((e && e.message) || "請確認個人 AI Relay 設定") + "）";
      turn.replyZh = "";
    }

    speakLoading = false;
    renderSpeakConversation();
  }

  // 呼叫自己的 Cloudflare Worker；前端只傳 Relay token，絕不保存 AI API key。
  async function callSpeakTurn(scenario, history, userText){
    var systemPrompt =
      "You are role-playing as " + scenario.role + " in a spoken English practice conversation with a Traditional-Chinese-speaking English learner. " +
      "Keep your in-character reply natural, warm, and short (1-3 sentences), appropriate for a B1-B2 learner, and ask a follow-up question or make a relevant remark to keep the conversation going. " +
      "Also give the learner quick feedback on the English they just said. " +
      "Respond with ONLY valid JSON and nothing else (no markdown fences, no preamble), in exactly this shape: " +
      '{"reply": "your in-character English reply", "replyZh": "Traditional Chinese translation of your reply", ' +
      '"hasIssues": true or false, "better": "a more natural or correct version of what the learner just said, empty string if hasIssues is false", ' +
      '"note": "a short Traditional Chinese explanation of what was improved and why, empty string if hasIssues is false"}';

    var messages = [
      { role: "user", content: "(Begin the roleplay scenario now.)" },
      { role: "assistant", content: scenario.opener }
    ];
    history.forEach(function(turn){
      messages.push({ role: turn.role, content: turn.text });
    });
    messages.push({ role: "user", content: userText });

    if(!hasSpeakRelay()){
      throw new Error("尚未連接個人 AI。請先完成 AI 設定。");
    }

    var headers = { "Content-Type": "application/json" };
    if(speakRelay.accessToken){
      headers.Authorization = "Bearer " + speakRelay.accessToken;
    }
    var response = await fetch(speakRelay.url + "/speak", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        system: systemPrompt,
        messages: messages
      })
    });
    var raw = await response.text();
    var data;
    try{ data = raw ? JSON.parse(raw) : {}; }catch(e){ data = {}; }
    if(!response.ok){
      throw new Error((data && data.error) || ("Relay 回應失敗（HTTP " + response.status + "）。"));
    }
    if(!data || typeof data.reply !== "string"){
      throw new Error("Relay 回傳的口說資料格式不正確。");
    }
    return data;
  }

  // ---------------- 畫面渲染：學習紀錄與近 14 天圖表 ----------------
  // 從本機 reviewLog 與 words 計算累積統計，不會另外寫入新資料。
  function renderStats(){
    if(!loaded){
      statsEl.innerHTML = '<div class="center-note"><span class="spinner"></span>載入資料中…</div>';
      return;
    }
    var total = data.words.length;
    var known = data.words.filter(isKnown).length;
    var due = dueWords().length;
    var totalCorrect = 0, totalTotal = 0;
    data.reviewLog.forEach(function(l){ totalCorrect += l.correct; totalTotal += l.total; });
    var accAll = totalTotal > 0 ? Math.round(100*totalCorrect/totalTotal) : 0;

    // last 14 days: words added per day
    var days = [];
    var t = todayStr();
    for(var i=13;i>=0;i--) days.push(addDays(t, -i));
    var addedByDay = {};
    days.forEach(function(d){ addedByDay[d] = 0; });
    data.words.forEach(function(w){ if(addedByDay[w.addedAt] !== undefined) addedByDay[w.addedAt]++; });
    var maxAdded = Math.max(1, Math.max.apply(null, days.map(function(d){ return addedByDay[d]; })));

    var growthBars = days.map(function(d){
      var h = Math.max(2, Math.round(100 * addedByDay[d] / maxAdded));
      return '<div class="bar" style="height:' + h + '%" title="' + d + '：新增 ' + addedByDay[d] + ' 字"></div>';
    }).join("");
    var growthLabels = days.map(function(d){ return '<span>' + d.slice(5) + '</span>'; }).join("");

    // accuracy per day (from reviewLog) for last 14 days
    var logByDay = {};
    data.reviewLog.forEach(function(l){ logByDay[l.date] = l; });
    var accBars = days.map(function(d){
      var l = logByDay[d];
      if(!l || l.total === 0) return '<div class="bar" style="height:2%; background:var(--rule);" title="' + d + '：無複習"></div>';
      var pct = Math.round(100*l.correct/l.total);
      var cls = pct >= 70 ? "acc-good" : "acc-bad";
      return '<div class="bar ' + cls + '" style="height:' + Math.max(4,pct) + '%" title="' + d + '：' + pct + '% (' + l.correct + '/' + l.total + ')"></div>';
    }).join("");

    statsEl.innerHTML =
      '<div class="stat-strip">' +
        statBox(total, "總單字量") +
        statBox(known, "已進入循環複習") +
        statBox(due, "今日到期") +
        statBox(accAll + "%", "累積答對率") +
      '</div>' +

      '<div class="chart-block">' +
        '<div class="chart-title">單字量成長（近 14 天新增）</div>' +
        '<div class="bar-row">' + growthBars + '</div>' +
        '<div class="bar-labels">' + growthLabels + '</div>' +
      '</div>' +

      '<div class="chart-block">' +
        '<div class="chart-title">每日複習正確率（近 14 天，綠 ≥70%）</div>' +
        '<div class="bar-row">' + accBars + '</div>' +
        '<div class="bar-labels">' + growthLabels + '</div>' +
      '</div>' +

      '<div class="backup-zone">' +
        '<div class="chart-title">備份與還原（存成檔案，不受雲端存檔功能影響）</div>' +
        '<p class="form-hint">建議定期匯出備份，尤其如果你看到過「儲存失敗」的提示。備份檔案會下載到你的裝置上，之後可以隨時匯入回來。</p>' +
        '<div class="backup-actions">' +
          '<button class="ghost" id="export-backup-btn">⬇️ 匯出備份檔</button>' +
          '<label class="ghost backup-import-label">⬆️ 匯入備份檔<input type="file" id="import-backup-input" accept=".json" hidden></label>' +
          '<span class="form-hint" id="backup-result"></span>' +
        '</div>' +
      '</div>' +

      '<div class="danger-zone">' +
        '<button class="ghost" id="reset-data">清除所有資料（重新開始）</button>' +
      '</div>';

    document.getElementById("export-backup-btn").onclick = function(){
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var t = todayStr();
      a.href = url;
      a.download = "vocab-backup-" + t + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };

    var importInput = document.getElementById("import-backup-input");
    if(importInput){
      importInput.onchange = function(){
        var file = importInput.files && importInput.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = async function(e){
          var resultEl = document.getElementById("backup-result");
          try{
            var parsed = JSON.parse(e.target.result);
            if(!parsed || !Array.isArray(parsed.words)){
              if(resultEl) resultEl.textContent = "這個檔案格式看起來不對，匯入失敗。";
              return;
            }
            if(!confirm("匯入備份會覆蓋目前的單字與紀錄，確定要繼續嗎？")) return;
            data = parsed;
            if(!Array.isArray(data.reviewLog)) data.reviewLog = [];
            if(!data.importedDecks || typeof data.importedDecks !== "object") data.importedDecks = {};
            if(typeof data.studyCompletedDate !== "string") data.studyCompletedDate = "";
            session = null;
            await saveData();
            renderAll();
            if(resultEl) resultEl.textContent = "已成功匯入備份（" + data.words.length + " 個單字）。";
          } catch(err){
            if(resultEl) resultEl.textContent = "讀取這個檔案時發生錯誤，匯入失敗。";
          }
        };
        reader.readAsText(file, "UTF-8");
      };
    }

    document.getElementById("reset-data").onclick = async function(){
      if(!confirm("確定要清除所有單字與紀錄嗎？此動作無法復原。")) return;
      data = defaultData();
      session = null;
      await saveData();
      renderAll();
    };
  }

  // 重新渲染所有主要分頁；資料變動後以此同步 UI。
  function renderAll(){
    renderReview();
    renderBank();
    renderStats();
  }

  // ---------------- 分頁切換：控制導覽按鈕與四個分頁的顯示狀態 ----------------
  // 切換分頁時只重繪目前分頁，避免不必要的 DOM 更新。
  function switchTab(tab){
    currentTab = tab;
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    reviewEl.hidden = currentTab !== "review";
    bankEl.hidden = currentTab !== "bank";
    speakEl.hidden = currentTab !== "speak";
    statsEl.hidden = currentTab !== "stats";
    if(currentTab === "review") renderReview();
    if(currentTab === "bank") renderBank();
    if(currentTab === "speak") renderSpeak();
    if(currentTab === "stats") renderStats();
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(btn){
    btn.onclick = function(){ switchTab(btn.getAttribute("data-tab")); };
  });

  // ---------------- 每日預習：先看新字，再進入正式複習 ----------------
  // 從尚未完成的今日佇列建立預習卡；此步驟本身不改變複習排程。
  function buildStudyWords(){
    if(!session) startSession();
    var seen = {}; var list = [];
    session.queue.forEach(function(item){
      if(seen[item.id]) return;
      seen[item.id] = true;
      var w = data.words.find(function(x){ return x.id === item.id; });
      if(w) list.push(w);
    });
    return list;
  }

  // 以日期判斷今天是否已完成預習，避免同日重複顯示預習畫面。
  function needsStudyToday(){
    return data.studyCompletedDate !== todayStr();
  }

  // Keep the "not yet learned" pool topped up to a small target, one small
  // random batch at a time, instead of ever writing a huge chunk of the word
  // bank in one go (which was overloading the storage API and causing
  // "Storage set failed" errors). Words that have already been learned
  // (box > 0) don't count against this pool and free up room for new ones,
  // and this never touches words that are already due for scheduled review.
  // 尚未學過的字庫最低保有量；不足時才從外部 DECKS 隨機補入。
  var TOP_UP_TARGET = 30;
  // 每日 30 張新字的固定分配：以初、中階為主，高階字維持少量穿插。
  // 這個設定只影響「尚未加入學習清單的新字」，不會變更任何既有卡片的複習排程。
  var DAILY_LEVEL_QUOTA = { beginner: 12, intermediate: 14, advanced: 4 };
  // 逐次少量補入新字，避免一次寫入數千筆資料而造成儲存 API 失敗。
  async function topUpNewWordsIfNeeded(){
    var newCount = data.words.filter(function(w){ return w.box === 0; }).length;
    var needed = TOP_UP_TARGET - newCount;
    if(needed <= 0) return;

    var owned = {};
    data.words.forEach(function(w){ owned[w.en.toLowerCase()] = true; });

    // 先依程度建立可用字池，避免原本「全部混在一起隨機抽」時高階字集中出現。
    var pools = { beginner: [], intermediate: [], advanced: [] };
    Object.keys(DECKS).forEach(function(key){
      DECKS[key].forEach(function(item){
        if(!owned[item[0].toLowerCase()]){
          if(pools[key]) pools[key].push({ key: key, item: item });
        }
      });
    });
    var availableCount = Object.keys(pools).reduce(function(total, key){
      return total + pools[key].length;
    }, 0);
    if(availableCount === 0) return;

    Object.keys(pools).forEach(function(key){ shuffle(pools[key]); });
    var picks = [];

    // 依固定比例取字；若今天只需補部分新字，比例也會等比例縮小。
    Object.keys(DAILY_LEVEL_QUOTA).forEach(function(key){
      var quota = Math.round(needed * DAILY_LEVEL_QUOTA[key] / TOP_UP_TARGET);
      quota = Math.min(quota, pools[key].length);
      picks = picks.concat(pools[key].splice(0, quota));
    });

    // 四捨五入或某程度字庫不足時，把剩餘名額從其他程度的可用字補滿。
    if(picks.length < needed){
      var fallbackPool = [];
      Object.keys(pools).forEach(function(key){ fallbackPool = fallbackPool.concat(pools[key]); });
      shuffle(fallbackPool);
      picks = picks.concat(fallbackPool.slice(0, needed - picks.length));
    }
    var t = todayStr();
    picks.forEach(function(p){
      data.words.push(makeWord(p.item[0], p.item[1], p.item[2], t, p.key, p.item[3]));
    });
    await saveData();
  }

  // 隱藏預習遮罩並顯示四個主要分頁；這不會自動開始作答。
  function showMainApp(){
    document.getElementById("study-screen").hidden = true;
    document.getElementById("main-app").hidden = false;
    renderAll();
    var footerCopy = document.querySelector("footer.note .footer-copy");
    if(footerCopy){
      if(storageBackend === "local"){
        footerCopy.textContent = "資料儲存在這個瀏覽器裡（localStorage），只有這台裝置、這個瀏覽器看得到，換裝置或清除瀏覽器資料會遺失，建議定期到「學習紀錄」分頁匯出備份。";
      } else if(storageBackend === "memory"){
        footerCopy.textContent = "⚠️ 目前偵測不到任何可用的儲存功能，這次的學習進度只會保留在這個分頁裡，重新整理或關閉分頁就會消失。強烈建議到「學習紀錄」分頁匯出備份檔。";
      } else {
        footerCopy.textContent = "資料只儲存在你自己的帳號下，僅你可見（personal storage）。";
      }
    }
  }

  // 標記今日預習完成、保存資料，並導向今日複習分頁。
  async function finishStudy(){
    data.studyCompletedDate = todayStr();
    await saveData();
    showMainApp();
  }

  // 渲染每日預習卡與翻面操作；完成後才讓使用者進入主應用程式。
  function renderStudyScreen(){
    var screen = document.getElementById("study-screen");
    screen.hidden = false;

    if(studyWords.length === 0){
      finishStudy();
      return;
    }

    if(studyIndex >= studyWords.length){
      screen.innerHTML =
        '<div class="study-wrap">' +
          '<div class="study-complete">' +
            '<div class="study-complete-big">🎉 今天的字卡都看過一遍了！</div>' +
            '<p class="study-complete-sub">總共預習了 ' + studyWords.length + ' 個單字，現在進入「今日複習」實際測驗一下吧。</p>' +
            '<button class="primary" id="study-start-review">開始今日複習 →</button>' +
          '</div>' +
        '</div>';
      document.getElementById("study-start-review").onclick = finishStudy;
      return;
    }

    var w = studyWords[studyIndex];
    var pct = Math.round(100 * studyIndex / studyWords.length);
    var catLabel = (DECK_META[w.category] || DECK_META.custom).label;
    var posLabel = getPartOfSpeech(w.en, w.pos);
    var posClass = posLabel === "未標註" ? " pending" : "";
    var studyExamples = getCardExamples(w);
    var hasMultipleSenses = studyExamples.length > 1;
    var studyCardClass = hasMultipleSenses ? " multi-sense-study-card" : "";
    var studyCardStyle = hasMultipleSenses
      ? ' style="--study-sense-card-height:' + Math.max(340, getMultiSenseCardHeight(studyExamples) + 42) + 'px"'
      : "";
    var backContent = renderCardExamples(w, "study");

    screen.innerHTML =
      '<div class="study-wrap">' +
        '<div class="study-progress-row">' +
          '<span class="study-progress-label">學習階段 · ' + (studyIndex+1) + ' / ' + studyWords.length + '</span>' +
          '<button class="ghost study-skip" id="study-skip">跳過，直接複習 →</button>' +
        '</div>' +
        '<div class="mascot-progress-track"><div class="mascot-progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="study-card' + studyCardClass + (studyFlipped ? ' flipped' : '') + '" id="study-card"' + studyCardStyle + '>' +
          '<div class="study-card-inner">' +
            '<div class="study-card-front">' +
              '<span class="cat-tag">' + catLabel + '</span>' +
              '<div class="study-word">' + escapeHtml(w.en) + '</div>' +
              '<span class="pos-tag' + posClass + '">' + escapeHtml(posLabel) + '</span>' +
              '<button class="speak-btn" id="study-speak" title="播放發音">🔊</button>' +
              '<div class="study-flip-hint">點卡片看意思 →</div>' +
            '</div>' +
            '<div class="study-card-back">' +
              '<div class="study-zh">' + escapeHtml(w.zh) + '</div>' +
              backContent +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="study-nav">' +
          '<button class="ghost" id="study-prev"' + (studyIndex===0 ? " disabled" : "") + '>← 上一張</button>' +
          '<button class="primary" id="study-next">認識了，下一張 →</button>' +
        '</div>' +
      '</div>';

    document.getElementById("study-card").onclick = function(e){
      if(e.target.closest("#study-speak")) return;
      studyFlipped = !studyFlipped;
      renderStudyScreen();
    };
    document.getElementById("study-speak").onclick = function(e){
      e.stopPropagation();
      speak(w.en);
    };
    document.getElementById("study-next").onclick = function(){
      studyIndex++; studyFlipped = false; renderStudyScreen();
    };
    document.getElementById("study-prev").onclick = function(){
      if(studyIndex > 0){ studyIndex--; studyFlipped = false; renderStudyScreen(); }
    };
    document.getElementById("study-skip").onclick = function(){
      finishStudy();
    };
  }

  // ---------------- 初始化：載入資料、補入新字、決定先顯示預習或主畫面 ----------------
  document.getElementById("study-screen").innerHTML =
    '<div class="study-wrap"><div class="center-note"><span class="spinner"></span>載入單字資料中…</div></div>';

  loadData().then(function(){
    if(needsStudyToday()){
      return topUpNewWordsIfNeeded().then(function(){
        studyWords = buildStudyWords();
        studyIndex = 0;
        studyFlipped = false;
        renderStudyScreen();
      });
    } else {
      showMainApp();
    }
  });

})();
</script>
</body>
</html>
